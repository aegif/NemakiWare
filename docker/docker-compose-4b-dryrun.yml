# 4b dry-run overlay — disposable environments only.
#
# What it changes, and why each one is needed for the rehearsal rather than for production:
#
#   * ATLAS ONLY. The catalog client answers for one active backend, so a node that enables
#     both purview and atlas binds its probe and its historical publisher to purview and
#     leaves atlas with none. The rehearsal is against the local Atlas, so atlas is the one
#     that must be active.
#
#   * TIMEOUTS THAT FIT BOTH LEASES, PER ROUTE. The budget counts what each route actually
#     does — three catalog calls (pre-read, write, read-back), each retryable 3 times with
#     7.7s total backoff, plus the route's repository reads, the final CAS and 5s client
#     overhead — and requires the worst reachable route to fit inside the obligation claim
#     lease AND (for the historical route) the subject fence lease, each 300s with a 150s
#     margin. The worst route here is an external kind's observed materialisation, whose
#     source re-check is budgeted remote (30s): with 1s/6s it comes to
#     3x4x7s + 23.1s + 30s + 5s = ~142s, inside the 150s bound. The 2s/10s this file used
#     to carry was computed under the old two-call model and its true worst case is ~202s —
#     readiness now refuses it, and it is right to.
#
#   * JOURNALED MODE AND A SPOOL, owned by the Tomcat user. A named volume is created root-
#     owned, and the container runs as uid 999 — the write/link/fsync probe then fails and the
#     preflight is red for a reason that has nothing to do with lineage. The spool is the hot
#     path after activation, so this has to be right rather than worked around.
#
# It does NOT enable D-rest writes and does NOT activate the barrier. `POST /barrier/activate`
# is out of scope for a rehearsal by design — the point is to reach the instant before it.
#
# Usage (with the base file and the atlas file):
#   COUCHDB_USER=admin COUCHDB_PASSWORD=password \
#   docker compose -f docker-compose-simple.yml -f docker-compose-atlas.yml \
#                  -f docker-compose-4b-dryrun.yml up -d --build --force-recreate --no-deps core

services:
  core:
    environment:
      # Replaces the atlas overlay's JAVA_TOOL_OPTIONS wholesale (same key), so purview.enabled
      # is genuinely absent rather than overridden to false somewhere further down.
      - JAVA_TOOL_OPTIONS=-Datlas.enabled=true -Datlas.endpoint=http://atlas:21000 -Datlas.username=${ATLAS_USER:-admin} -Datlas.password=${ATLAS_PASSWORD:-admin} -Datlas.connect.timeout.ms=1000 -Datlas.read.timeout.ms=6000 -Dlineage.mode=journaled -Dlineage.targets=atlas -Dlineage.spool.dir=/var/lineage-spool -Dlineage.drest.enabled=true
    volumes:
      - lineage_spool:/var/lineage-spool
    user: root
    # Root only for the rehearsal, and only to make a named volume writable. A real deployment
    # gives the spool path to the service user instead; running the application as root is not
    # something this checklist is recommending.

volumes:
  lineage_spool:
