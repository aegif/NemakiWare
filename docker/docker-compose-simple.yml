# =============================================================================
# DEVELOPMENT / EVALUATION compose — NOT for production.
# The backing services CouchDB (5984) and Solr (8983) are bound to 127.0.0.1
# so they are not reachable off-host even on a public IP. The core app (8080)
# is still published on 0.0.0.0 for LAN/dev access — front it with TLS or a
# firewall on any shared host. For production use docker-compose-prod.yml,
# which keeps CouchDB/Solr on the internal network and binds core to 127.0.0.1
# behind a TLS front. See deploy/README.md.
# =============================================================================
services:
  # CouchDB 3.x - Current version
  # NOTE: COUCHDB_USER and COUCHDB_PASSWORD must be set in the host
  # environment (or .env file). No defaults — compose will fail loudly
  # if these are missing, preventing accidental admin/password deployment.
  couchdb:
    image: couchdb:3.3.3
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/compaction.ini
    environment:
      - COUCHDB_USER=${COUCHDB_USER:?COUCHDB_USER must be set}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${COUCHDB_USER}:${COUCHDB_PASSWORD}", "http://localhost:5984/_all_dbs"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # OpenLDAP Server (for LDAP sync & Keycloak federation tests)
  # Enable with: docker compose --profile idp up -d
  #
  # When using --profile idp, LDAP_ADMIN_PASSWORD must be set in the host
  # environment. We use ${LDAP_ADMIN_PASSWORD:-} (empty fallback) here
  # rather than ${VAR:?...} so that compose parsing succeeds for non-idp
  # invocations (compose evaluates interpolation eagerly even for
  # profile-gated services). The osixia/openldap image rejects an empty
  # admin password and exits, providing fail-fast at container startup.
  openldap:
    image: osixia/openldap:1.5.0
    profiles:
      - idp
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "NemakiWare Test"
      LDAP_DOMAIN: "nemakiware.example.com"
      LDAP_BASE_DN: "dc=nemakiware,dc=example,dc=com"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-}"
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: "/ldif-seed"
    volumes:
      - ./ldap/bootstrap:/ldif-seed:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=nemakiware,dc=example,dc=com", "-D", "cn=admin,dc=nemakiware,dc=example,dc=com", "-w", "${LDAP_ADMIN_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Keycloak Identity Provider (OIDC/SAML + LDAP federation)
  # Enable with: docker compose --profile idp up -d
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    profiles:
      - idp
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8088"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak/realm-ldap-integration.json:/opt/keycloak/data/import/realm.json
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Solr Search Engine
  solr:
    build: ./solr
    ports:
      - "127.0.0.1:8983:8983"
    environment:
      - SOLR_HOME=/var/solr/data
      - SOLR_HEAP=512m
    volumes:
      - solr_data:/var/solr/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Core CMIS Server
  core:
    build:
      context: ./core
      dockerfile: Dockerfile.simple
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Dorg.ektorp.support.AutoUpdateViewOnChange=false -Dorg.ektorp.http.IdleConnectionMonitor.enabled=false -Dorg.ektorp.support.DesignDocument.UPDATE_ON_DIFF=false -Dorg.ektorp.support.DesignDocument.ALLOW_AUTO_UPDATE=true -Dorg.apache.catalina.loader.WebappClassLoader.ENABLE_CLEAR_REFERENCES=true -Dorg.apache.tomcat.util.scan.StandardJarScanFilter.jarsToSkip=*.jar
      # CouchDB credentials are mandatory (?:- form fails-fast if unset).
      # Other ${VAR:-} fallbacks remain only for optional features (cloud auth,
      # OIDC, SAML, LDAP) where empty / disabled is the safe default.
      # When DIRECTORY_SYNC_ENABLED=true, LDAP_BIND_PASSWORD must be supplied.
      - CATALINA_OPTS=-Xms1g -Xmx3g -XX:+DisableExplicitGC -Dnemakiware.properties=/usr/local/tomcat/conf/nemakiware.properties -Drepositories.yml=/usr/local/tomcat/conf/repositories.yml -Ddb.couchdb.auth.enabled=true -Ddb.couchdb.auth.username=${COUCHDB_USER:?COUCHDB_USER must be set} -Ddb.couchdb.auth.password=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set} -Dsolr.host=solr -Dsolr.port=8983 -Dsolr.protocol=http -Dcloud.auth.google.enabled=${CLOUD_AUTH_GOOGLE_ENABLED:-false} -Dcloud.auth.google.clientId=${CLOUD_AUTH_GOOGLE_CLIENT_ID:-} -Dcloud.auth.microsoft.enabled=${CLOUD_AUTH_MICROSOFT_ENABLED:-false} -Dcloud.auth.microsoft.clientId=${CLOUD_AUTH_MICROSOFT_CLIENT_ID:-} -Dcloud.auth.microsoft.tenantId=${CLOUD_AUTH_MICROSOFT_TENANT_ID:-} -Dcloud.drive.google.enabled=${CLOUD_DRIVE_GOOGLE_ENABLED:-false} -Dcloud.drive.microsoft.enabled=${CLOUD_DRIVE_MICROSOFT_ENABLED:-false} -Dsso.oidc.enabled=${SSO_OIDC_ENABLED:-false} -Dsso.saml.enabled=${SSO_SAML_ENABLED:-false} -Doidc.enabled=${OIDC_ENABLED:-false} -Doidc.issuer=${OIDC_ISSUER:-http://keycloak:8080/realms/nemakiware} -Doidc.clientId=${OIDC_CLIENT_ID:-nemakiware-ui} -Ddirectory.sync.enabled=${DIRECTORY_SYNC_ENABLED:-false} -Ddirectory.sync.ldap.url=${LDAP_URL:-ldap://openldap:389} -Ddirectory.sync.ldap.base.dn=${LDAP_BASE_DN:-dc=nemakiware,dc=example,dc=com} -Ddirectory.sync.ldap.bind.dn=${LDAP_BIND_DN:-cn=admin,dc=nemakiware,dc=example,dc=com} -Ddirectory.sync.ldap.bind.password=${LDAP_BIND_PASSWORD:-} -Djdk.httpclient.allowRestrictedHeaders=host
    env_file:
      - path: ./secrets/microsoft-entra.env
        required: false
      # External connector secrets (Slack/Notion/Box/Dropbox ingest tokens).
      # Resolved by each connector's credentialRef key. See secrets/ingest-connectors.env.
      - path: ./secrets/ingest-connectors.env
        required: false
    volumes:
      - ./secrets:/usr/local/tomcat/secrets:ro
    restart: on-failure
    healthcheck:
      # Readiness, not liveness: /core answers as soon as the webapp is deployed, but the first
      # CMIS call still waits ~10s for the type cache, and concurrent requests arriving in that
      # window were measured queueing 8.3s behind it. /rest/all/readiness builds the cache and
      # returns 503 until it has, so an orchestrator does not route to a cold instance.
      test: ["CMD", "curl", "-f", "http://localhost:8080/core/rest/all/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ========================================
  # RAG (Retrieval-Augmented Generation) Components
  # Enable with: docker compose --profile rag up -d
  # ========================================

  # Text Embeddings Inference (TEI) Service
  # Hugging Face's embedding inference server for multilingual E5 model
  #
  # MEMORY: e5-large requires ~4GB RAM for ONNX inference.
  # If Docker Desktop has <=8GB, TEI may be OOM-killed (exit 137).
  # Increase Docker memory to >=12GB, or switch to e5-small (384 dim)
  # — but note that Solr schema uses knn_vector_1024 so dimension
  # change requires schema migration + full RAG reindex.
  tei:
    # Default: the official linux/amd64 CPU image (runs under emulation on Apple
    # Silicon). On ARM64 hosts, build a native image once with
    # docker/tei/build-arm64.sh and run with:
    #   NEMAKI_TEI_IMAGE=nemakiware-tei:1.7.4-arm64-ort NEMAKI_TEI_PLATFORM=linux/arm64
    # to drop the qemu emulation. Both expose the same native TEI /embed API.
    image: ${NEMAKI_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.6}
    platform: ${NEMAKI_TEI_PLATFORM:-linux/amd64}
    profiles:
      - rag
    ports:
      # Dev/eval: bind to loopback only (embedding service, no auth).
      - "127.0.0.1:8081:80"
    volumes:
      - tei_cache:/data
    deploy:
      resources:
        limits:
          # e5-large ONNX warmup peaks ~7 GiB; 8g avoids OOM (exit 137).
          memory: 8g
        reservations:
          memory: 2g
    environment:
      # Model: intfloat/multilingual-e5-large (1024 dimensions)
      # Matches Solr knn_vector_1024 schema. Do NOT change without
      # also updating solr/configsets/nemaki/conf/managed-schema.xml
      # and running a full RAG reindex.
      - MODEL_ID=intfloat/multilingual-e5-large
      # Hugging Face Hub settings
      - HF_HUB_URL=https://huggingface.co
      - HF_ENDPOINT=https://huggingface.co
      # Performance tuning
      - MAX_CLIENT_BATCH_SIZE=32
      - MAX_BATCH_TOKENS=16384
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  couchdb_data:
  solr_data:
  ldap_data:
  ldap_config:
  tei_cache:  # RAG: TEI model cache

networks:
  default:
    name: nemaki-network
