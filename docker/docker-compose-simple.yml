services:
  # CouchDB 3.x - Current version
  couchdb:
    image: couchdb:3.3.3
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/compaction.ini
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD:-password}", "http://localhost:5984/_all_dbs"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  # OpenLDAP Server (for LDAP sync & Keycloak federation tests)
  # Enable with: docker compose --profile idp up -d
  openldap:
    image: osixia/openldap:1.5.0
    profiles:
      - idp
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "NemakiWare Test"
      LDAP_DOMAIN: "nemakiware.example.com"
      LDAP_BASE_DN: "dc=nemakiware,dc=example,dc=com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_TLS: "false"
      LDAP_SEED_INTERNAL_LDIF_PATH: "/ldif-seed"
    volumes:
      - ./ldap/bootstrap:/ldif-seed:ro
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=nemakiware,dc=example,dc=com", "-D", "cn=admin,dc=nemakiware,dc=example,dc=com", "-w", "adminpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Keycloak Identity Provider (OIDC/SAML + LDAP federation)
  # Enable with: docker compose --profile idp up -d
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    profiles:
      - idp
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8088"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak/realm-ldap-integration.json:/opt/keycloak/data/import/realm.json
    depends_on:
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Solr Search Engine
  solr:
    build: ./solr
    ports:
      - "8983:8983"
    environment:
      - SOLR_HOME=/var/solr/data
      - SOLR_HEAP=512m
    volumes:
      - solr_data:/var/solr/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Core CMIS Server
  core:
    build:
      context: ./core
      dockerfile: Dockerfile.simple
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Dorg.ektorp.support.AutoUpdateViewOnChange=false -Dorg.ektorp.http.IdleConnectionMonitor.enabled=false -Dorg.ektorp.support.DesignDocument.UPDATE_ON_DIFF=false -Dorg.ektorp.support.DesignDocument.ALLOW_AUTO_UPDATE=true -Dorg.apache.catalina.loader.WebappClassLoader.ENABLE_CLEAR_REFERENCES=true -Dorg.apache.tomcat.util.scan.StandardJarScanFilter.jarsToSkip=*.jar
      - CATALINA_OPTS=-Xms1g -Xmx3g -XX:+DisableExplicitGC -Dnemakiware.properties=/usr/local/tomcat/conf/nemakiware.properties -Drepositories.yml=/usr/local/tomcat/conf/repositories.yml -Dlog4j.configuration=file:/usr/local/tomcat/conf/log4j.properties -Ddb.couchdb.auth.enabled=true -Ddb.couchdb.auth.username=${COUCHDB_USER:-admin} -Ddb.couchdb.auth.password=${COUCHDB_PASSWORD:-password} -Dsolr.host=solr -Dsolr.port=8983 -Dsolr.protocol=http -Dcloud.auth.google.enabled=${CLOUD_AUTH_GOOGLE_ENABLED:-false} -Dcloud.auth.google.clientId=${CLOUD_AUTH_GOOGLE_CLIENT_ID:-} -Dcloud.auth.microsoft.enabled=${CLOUD_AUTH_MICROSOFT_ENABLED:-false} -Dcloud.auth.microsoft.clientId=${CLOUD_AUTH_MICROSOFT_CLIENT_ID:-} -Dcloud.auth.microsoft.tenantId=${CLOUD_AUTH_MICROSOFT_TENANT_ID:-} -Dcloud.drive.google.enabled=${CLOUD_DRIVE_GOOGLE_ENABLED:-false} -Dcloud.drive.microsoft.enabled=${CLOUD_DRIVE_MICROSOFT_ENABLED:-false} -Dsso.oidc.enabled=${SSO_OIDC_ENABLED:-false} -Dsso.saml.enabled=${SSO_SAML_ENABLED:-false} -Doidc.enabled=${OIDC_ENABLED:-false} -Doidc.issuer=${OIDC_ISSUER:-http://keycloak:8080/realms/nemakiware} -Doidc.clientId=${OIDC_CLIENT_ID:-nemakiware-ui} -Ddirectory.sync.enabled=${DIRECTORY_SYNC_ENABLED:-false} -Ddirectory.sync.ldap.url=${LDAP_URL:-ldap://openldap:389} -Ddirectory.sync.ldap.base.dn=${LDAP_BASE_DN:-dc=nemakiware,dc=example,dc=com} -Ddirectory.sync.ldap.bind.dn=${LDAP_BIND_DN:-cn=admin,dc=nemakiware,dc=example,dc=com} -Ddirectory.sync.ldap.bind.password=${LDAP_BIND_PASSWORD:-adminpassword}
    env_file:
      - path: ./secrets/microsoft-entra.env
        required: false
    volumes:
      - ./secrets:/usr/local/tomcat/secrets:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/core"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ========================================
  # RAG (Retrieval-Augmented Generation) Components
  # Enable with: docker compose --profile rag up -d
  # ========================================

  # Text Embeddings Inference (TEI) Service
  # Hugging Face's embedding inference server for multilingual E5 model
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    platform: linux/amd64  # Required for Apple Silicon (Rosetta emulation)
    profiles:
      - rag
    ports:
      - "8081:80"
    volumes:
      - tei_cache:/data
    environment:
      # Model: intfloat/multilingual-e5-large (1024 dimensions)
      - MODEL_ID=intfloat/multilingual-e5-large
      # Hugging Face Hub settings
      - HF_HUB_URL=https://huggingface.co
      - HF_ENDPOINT=https://huggingface.co
      # Performance tuning
      - MAX_CLIENT_BATCH_SIZE=32
      - MAX_BATCH_TOKENS=16384
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  couchdb_data:
  solr_data:
  ldap_data:
  ldap_config:
  tei_cache:  # RAG: TEI model cache

networks:
  default:
    name: nemaki-network
