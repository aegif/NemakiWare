### Lineage Journal Configuration
## Controls how lineage events (archive, cloud-sync, import/export) are tracked.
## Modes:
##   disabled  — no lineage tracking, no storage overhead (default)
##   direct    — existing Purview/Atlas direct-publish only, no local journal
##   journaled — events stored in CouchDB journal; used as projection source
#lineage.mode=disabled
## Comma-separated publish targets: purview, atlas, dataplex
#lineage.targets=
## Retention days for journaled events (only applies when mode=journaled)
#lineage.retention.days=90
## Phase 3 expansion flags
#lineage.capture.version-events=false
#lineage.capture.generic-relationships=false
## Purge schedule for expired journal entries (Spring cron, empty = disabled)
#lineage.purge.cron=

## Capture boundary (external ingest): an intent row is written to nemaki_lineage BEFORE the
## ingest changes anything, and completed afterwards, so a crash in between cannot leave a
## document whose origin nothing records. Applies only to repositories whose effective
## lineage.mode is "journaled" — disabled and direct behave exactly as before.
##
## Note the prefix: "capture-boundary", not "capture". lineage.capture.version-events above is a
## different feature with a different meaning of the word.
##
## How long an intent may stay open before the sweeper calls it UNRESOLVED.
#lineage.capture-boundary.stale.minutes=15
## How often to sweep. A separate question from the threshold above, hence a separate key.
#lineage.capture-boundary.sweep.interval.minutes=5
## Rows touched per pass. Bounded because leader election is off by default, and when off every
## replica walks the same batch.
#lineage.capture-boundary.sweep.batch=200
## Retention. 0 or unset = KEEP FOREVER, which is the default for both: these rows are the
## evidence of what was ingested and when, and of what failed. Deleting evidence is an operator's
## decision, not the product's.
##
## The cost of keeping everything is that nemaki_lineage grows with ingest volume, permanently.
## It is MORE than one row per ingested item: attachments and preserved raw .eml files each get
## their own row, so a mail with five attachments produces seven. Watch the database size — and
## note that a larger nemaki_lineage also lengthens any future rebuild of the lineage views.
#lineage.capture-boundary.retention.unresolved.days=0
#lineage.capture-boundary.retention.captured.days=0

###Cloud Directory Sync Configuration
# OFF by default. This file is baked into the published image (Dockerfile.simple
# copies it to WEB-INF/classes, which is what Spring reads), so anything set here
# is a default for EVERY deployment, not a local convenience. Enabling the sync
# here arms a cron job in every operator's server.
