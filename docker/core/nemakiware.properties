### Lineage Journal Configuration
## Controls how lineage events (archive, cloud-sync, import/export) are tracked.
## Modes:
##   disabled  — no lineage tracking, no storage overhead (default)
##   direct    — existing Purview/Atlas direct-publish only, no local journal
##   journaled — events stored in CouchDB journal; used as projection source
#lineage.mode=disabled
## Comma-separated publish targets: purview, atlas, dataplex
#lineage.targets=
## Retention days for journaled events (only applies when mode=journaled)
#lineage.retention.days=90
## Phase 3 expansion flags
#lineage.capture.version-events=false
#lineage.capture.generic-relationships=false
## Purge schedule for expired journal entries (Spring cron, empty = disabled)
#lineage.purge.cron=

