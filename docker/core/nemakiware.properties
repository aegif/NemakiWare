cloud.directory.sync.google.adminEmail=
# Microsoft Entra ID
cloud.directory.sync.microsoft.tenantId=
cloud.directory.sync.microsoft.clientId=
cloud.directory.sync.microsoft.clientSecret=

### Outbound SSRF hardening (security audit)
# Opt-in SSRF check for admin-configured outbound catalog endpoints
# (Purview / Atlas). Default false so existing internal / on-prem
# endpoints keep working. Set to true on internet-facing deployments to
# reject endpoints that resolve to internal / special-use addresses at
# save time.
nemakiware.security.outbound.validateInternal=false

### Search-index ACL reconciliation (durable retry of failed async ACL refreshes)
# When an async search-index ACL refresh (readers / RAG block / relationship
# reverse-reindex) fails, the affected object is recorded in a durable CouchDB
# queue (nemaki_conf) and re-driven by a leader-gated poller. All optional —
# the values below are the built-in defaults.
#nemakiware.searchindex.reconcile.pollIntervalSeconds=120
#nemakiware.searchindex.reconcile.maxAttempts=10
#nemakiware.searchindex.reconcile.batchSize=50
#nemakiware.searchindex.reconcile.baseBackoffSeconds=60
#nemakiware.searchindex.reconcile.leaseSeconds=300

# ACL-epoch fencing (design docs/design/acl-epoch-fencing.md §11). ALWAYS ON since 3.3.0 —
# there is no pre-epoch ACL write path to fall back to, so there is no enable/disable switch.
# A leftover acl.epoch.wiring.enabled=false is IGNORED and warned about at startup.
# Crash-recovery sweep (leader-gated):
acl.epoch.scan.intervalSeconds=300
acl.epoch.scan.maxDocsPerPass=500

