###SAML
saml.enabled=true
saml.idp.metadata.url=http://keycloak:8080/realms/nemakiware/protocol/saml/descriptor
saml.sp.entity.id=nemakiware-sp
saml.principal.claim.name=ID
saml.isAutoCreateUser=true
# Strict InResponseTo enforcement (anti-replay / unsolicited-Response defence).
# When true, every SAML Response must carry an InResponseTo matching an
# AuthnRequest ID this SP issued via POST /rest/all/saml/initiate. That
# endpoint generates the ID server-side and returns it together with an
# HttpOnly NEMAKI_SAML_BIND cookie that ties the subsequent Response back
# to *this browser session*. The shipped React UI uses this flow
# automatically; turn this on once any custom SAML clients (mobile apps,
# scripted SP-initiated logins, ...) have been migrated to /saml/initiate.
saml.require.inResponseTo=false

# Public-request scheme. Controls whether the SAML binding cookie and the
# auth-token cookie are flagged Secure, and surfaces proxy misconfigurations.
#   auto  — default. Set Secure based on request.isSecure() (Tomcat's
#           RemoteIpValve rewrites that flag from X-Forwarded-Proto when
#           the proxy IP is in internalProxies). Pick this when you trust
#           the proxy chain.
#   https — operator declares the public URL is HTTPS. Cookies are ALWAYS
#           Secure-flagged regardless of what request.isSecure() reports,
#           so a proxy hop that drops X-Forwarded-Proto cannot silently
#           downgrade cookie security to non-Secure on an HTTPS public URL.
#           When the request itself does not look secure (proxy misconfig),
#           a per-minute throttled WARN line is logged on every SAML
#           initiate / cookie-setting code path so the operator can fix
#           the proxy without paying for that detection in cookie strength.
#   http  — explicit HTTP-only, dev only.
nemakiware.public.scheme=auto

