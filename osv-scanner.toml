# osv-scanner ignore configuration — documented, time-boxed risk acceptance.
#
# Referenced explicitly via `osv-scanner --config=osv-scanner.toml` in
# .github/workflows/security-scan.yml. Every entry MUST mirror a row in
# SECURITY-EXCEPTIONS.md and carry an `ignoreUntil`; once the OSV job is
# gated (continue-on-error removed), an expired ignore lets the vuln fail CI,
# forcing re-review.

