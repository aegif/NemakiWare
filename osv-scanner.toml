# osv-scanner ignore configuration — documented, time-boxed risk acceptance.
#
# Referenced explicitly via `osv-scanner --config=osv-scanner.toml` in
# .github/workflows/security-scan.yml. Every entry MUST mirror a row in
# SECURITY-EXCEPTIONS.md and carry an `ignoreUntil`. The required "Security
# exception expiry" job reads `ignoreUntil` and turns red once it has passed,
# forcing re-review. What it would take for the OSV job itself to fail on a
# finding is in its FLIP CONDITION (security-scan.yml).

# (No active OSV ignores.)
#
# GHSA-qhr7-h655-pw6r (solr-core Basic-Auth setup tool) was removed on the
# Solr 10 upgrade: the WAR no longer depends on solr-core at all (the custom
# jp.aegif.nemaki.solr module that dragged it in was decommissioned), and the
# runtime image is solr:10.0.0-slim. The advisory no longer applies to any
# artifact we ship, so the exception is retired rather than renewed.
