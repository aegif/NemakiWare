name: NemakiWare Integration Tests

on:
  push:
    branches: [ master, main, develop, 'release/**' ]
    paths:
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'

jobs:
  # ── Fast unit tests (no server needed) ─────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Run unit tests
        run: |
          mvn test \
            -Dtest='ResourceBaseCsrfProtectionTest,CanonicalImportServiceTest,WebhookServiceTest,WebhookConfigTest,WebhookConfigParserTest,WebhookDeliveryServiceTest,HttpWebhookDispatcherTest,WebhookEventMatcherTest,ChildEventBatchProcessorTest,LiteralTypeValidatorTest,SolrPredicateWalkerMultilingualTest,NavigationPaginationTest,FilesystemImporterTest,ImportExportResourceTest,SlackConnectorAdapterTest,TeamsConnectorAdapterTest,ChatworkConnectorAdapterTest,MattermostConnectorAdapterTest,NotionConnectorAdapterTest,SalesforceConnectorAdapterTest,BoxDropboxAdapterTest' \
            -f core/pom.xml -Pdevelopment
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-reports, path: core/target/surefire-reports/, retention-days: 7 }

  # ── Integration tests (require running server) ─────────────
  integration-tests:
    name: VersioningBehaviorTest + InheritedFlagTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean install -f solr/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment -DskipTests -q

      - name: Start NemakiWare Server
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          echo "Waiting for NemakiWare server to be ready..."
          for i in {1..60}; do
            if curl -sf -u admin:admin http://localhost:8080/core/atom/bedroom > /dev/null 2>&1; then
              echo "NemakiWare server is ready (attempt $i)"
              break
            fi
            echo "Waiting for server... ($i/60)"
            sleep 5
          done
          curl -sf -u admin:admin http://localhost:8080/core/atom/bedroom > /dev/null || exit 1

      - name: Run integration tests
        run: |
          mvn test \
            -Dtest='VersioningBehaviorTest,InheritedFlagTest' \
            -f core/pom.xml -Pdevelopment \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── TCK CMIS compliance tests (require running server) ─────
  tck-tests:
    name: TCK CMIS Compliance (38 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean install -f solr/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment -DskipTests -q

      - name: Start NemakiWare Server
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          echo "Waiting for NemakiWare server to be ready..."
          for i in {1..60}; do
            if curl -sf -u admin:admin http://localhost:8080/core/atom/bedroom > /dev/null 2>&1; then
              echo "NemakiWare server is ready (attempt $i)"
              break
            fi
            echo "Waiting for server... ($i/60)"
            sleep 5
          done
          curl -sf -u admin:admin http://localhost:8080/core/atom/bedroom > /dev/null || exit 1

      - name: Run TCK tests
        run: |
          mvn test \
            -Dtest='ConnectionTestGroup,BasicsTestGroup,TypesTestGroup,ControlTestGroup,VersioningTestGroup,CrudTestGroup1,CrudTestGroup2,QueryTestGroup' \
            -Dsurefire.excludes= \
            -f core/pom.xml -Pdevelopment \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tck-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f
