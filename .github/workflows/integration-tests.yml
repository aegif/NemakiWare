name: NemakiWare Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop, 'release/**' ]
    paths:
      - 'pom.xml'
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      # The unit job carries a lock that reads the manual-run SCREENS. Without this a
      # UI-only revert does not start this workflow at all, so the lock is on the list
      # and the list never runs for the change it guards.
      - 'core/src/main/webapp/ui/src/**'
      # Every document under docs/. The forbidden-claim lint reads every .md and .json under
      # docs/, so a claim in any of them has to start this workflow (review, P2).
      - 'docs/**'
      # The unit job counts the controls and checks the canon's number against them.
      # Without these, retiring a control or editing that number does not start this
      # workflow, so the check exists and never gates (Codex review, P2).
      - 'tools/negative-controls/**'
      - 'docs/design/fail-closed-reads.md'
      # The evidence profile spec and the vectors both languages read. A change to
      # either is a change to what every external verifier must do.
      - 'docs/design/evidence-profile-v1.md'
      # NOTE: everyDocumentALockReadsStartsTheWorkflow derives paths from core's tests only;
      # documents the verifier modules' locks read (this schema) are listed by hand.
      - 'docs/evidence-profile/v1/**'
      # The progress documents. A lock reads their counts against the canon and the
      # runner, and reads the Phase 0 gate against the profile spec. Editing a number
      # in either of these is exactly the change that has to start this workflow.
      - 'docs/design/v3.4.0-evidence-and-residuals-plan.md'
      - 'docs/design/v3.4-release-readiness.md'
      # E1's scope lock reads the Phase 0 inventory's write-path table.
      - 'docs/design/evidence-phase0-inventory.md'
      # The OPERATOR-facing documents. Three locks in this batch read files under
      # docs/operations/, and the forbidden-claim lint reads docs/operations/ and
      # docs/compliance/ as two of its four shipped roots — none of which were in
      # this list, so a PR deleting the ABSENT row or the 「更新しない」 sentence
      # touched only paths that never start this workflow and went green
      # (subagent review, P2).
      - 'docs/operations/**'
      - 'docs/compliance/**'
      # The independent verifier module, which has its own test step.
      - 'evidence-verifier-core/**'
      - 'evidence-verifier-cli/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'
      - 'scripts/ci-complete-setup.sh'
      - 'scripts/ci-seed-odata-docs.sh'
      # Reader-facing text outside docs/ that the forbidden-claim lint reads, and the release
      # notes two locks read. Only docs/ paths were ever checked, so these never had to start
      # this workflow (subagent review, P2).
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'deploy/**'
      - 'docker/**'
      # What the UI version lock reads besides ui/src (3.4.1).
      - 'core/src/main/webapp/ui/package.json'
      - 'core/src/main/webapp/ui/vite.config.ts'
      # What the release-tool locks read (3.4.1): the OSV check, the SBOM script and the scan settings.
      - 'tools/sbom/**'
      - '.trivyignore.yaml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'pom.xml'
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      # The unit job carries a lock that reads the manual-run SCREENS. Without this a
      # UI-only revert does not start this workflow at all, so the lock is on the list
      # and the list never runs for the change it guards.
      - 'core/src/main/webapp/ui/src/**'
      # Every document under docs/. The forbidden-claim lint reads every .md and .json under
      # docs/, so a claim in any of them has to start this workflow (review, P2).
      - 'docs/**'
      # The unit job counts the controls and checks the canon's number against them.
      # Without these, retiring a control or editing that number does not start this
      # workflow, so the check exists and never gates (Codex review, P2).
      - 'tools/negative-controls/**'
      - 'docs/design/fail-closed-reads.md'
      # The evidence profile spec and the vectors both languages read. A change to
      # either is a change to what every external verifier must do.
      - 'docs/design/evidence-profile-v1.md'
      # NOTE: everyDocumentALockReadsStartsTheWorkflow derives paths from core's tests only;
      # documents the verifier modules' locks read (this schema) are listed by hand.
      - 'docs/evidence-profile/v1/**'
      # The progress documents. A lock reads their counts against the canon and the
      # runner, and reads the Phase 0 gate against the profile spec. Editing a number
      # in either of these is exactly the change that has to start this workflow.
      - 'docs/design/v3.4.0-evidence-and-residuals-plan.md'
      - 'docs/design/v3.4-release-readiness.md'
      # E1's scope lock reads the Phase 0 inventory's write-path table.
      - 'docs/design/evidence-phase0-inventory.md'
      # The OPERATOR-facing documents. Three locks in this batch read files under
      # docs/operations/, and the forbidden-claim lint reads docs/operations/ and
      # docs/compliance/ as two of its four shipped roots — none of which were in
      # this list, so a PR deleting the ABSENT row or the 「更新しない」 sentence
      # touched only paths that never start this workflow and went green
      # (subagent review, P2).
      - 'docs/operations/**'
      - 'docs/compliance/**'
      # The independent verifier module, which has its own test step.
      - 'evidence-verifier-core/**'
      - 'evidence-verifier-cli/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'
      - 'scripts/ci-complete-setup.sh'
      - 'scripts/ci-seed-odata-docs.sh'
      # The same reader-facing text outside docs/ as the push trigger.
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'deploy/**'
      - 'docker/**'
      # What the UI version lock reads besides ui/src (3.4.1).
      - 'core/src/main/webapp/ui/package.json'
      - 'core/src/main/webapp/ui/vite.config.ts'
      # What the release-tool locks read (3.4.1): the OSV check, the SBOM script and the scan settings.
      - 'tools/sbom/**'
      - '.trivyignore.yaml'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read
  packages: read   # resolve custom OpenCMIS 1.1.0-nemakiware from GitHub Packages

jobs:
  # ── Fast unit tests (no server needed) ─────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build sibling modules
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
      # A shell step, not a Java test. Every Java version of this check was self-referential:
      # remove a class from the list and the test that would have complained is the one that no
      # longer runs. It used to assert that a hand-written list of locks was a subset of a
      # hand-written -Dtest allow-list. The allow-list is gone (the job runs the whole suite by
      # exclusion), so the thing to guard is the opposite: that nobody quietly brings it back.
      #
      # It does NOT protect against deleting the step itself — that is visible in the diff and is
      # where review has to do the work.
      - name: The unit job runs the whole suite, not a chosen list
        run: |
          set -eu
          # Scoped to THIS job by name, not by position (a job inserted above used to be read
          # instead). The sed range ends at the next two-space key, where the next job starts.
          # Anchored to the start of a line so this step's own text is not what gets read.
          LIST=$(sed -n '/^  unit-tests:/,/^  [a-z]/p' .github/workflows/integration-tests.yml \
                 | grep -oE "^ +-Dtest='[^']*'" | head -1)
          if [ -z "$LIST" ]; then
            echo "::error::no -Dtest list found inside the unit-tests job"; exit 1
          fi
          NAMES=$(printf '%s' "$LIST" | sed "s/^ *-Dtest='//; s/'$//")
          # Every entry must be an exclusion. One bare class name means someone narrowed the job
          # back to a chosen set, which is how the locks added with a batch stopped running here.
          printf '%s' "$NAMES" | tr ',' '\n' | while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            case "$entry" in
              !*) ;;
              *) echo "::error::the unit job names a class to RUN ($entry). This job must run the"
                 echo "::error::whole suite by exclusion, so a lock added with a batch runs without"
                 echo "::error::being listed. Exclude what cannot run here; do not allow-list."
                 exit 1 ;;
            esac
          done
          echo "the unit job runs the whole suite; exclusions only: $NAMES"

      - name: Run unit tests
        run: |
          # THE WHOLE SUITE, by exclusion. This was a positive allow-list of ~125 class names out of
          # 637, so a lock added with a batch did not run here until someone remembered to add its
          # name — and the locks this release added for the authentication fixes were not in it
          # (external review T1, and our own review raised the same gap). An exclusion list cannot
          # go stale that way: a new test class runs unless it is named here.
          #
          # What is excluded and why:
          #   MultiThreadTest, InheritedFlagTest  — run in the integration jobs below, against a server
          #   *IT, jp.aegif.nemaki.cmis.tck.**    — integration / TCK, need a running stack
          #   AtlasManualDataLoader               — a manual data loader, not a test
          # This is the same list the release gate runs locally (CLAUDE.md).
          #
          # NOTE, unverified until this job first runs: on macOS + JDK 21 the local gate sees one
          # error — LineageBarrierTest$FrozenFormulas gets UnmeasurableException because that
          # platform has no SecureDirectoryStream. This runner is Linux, where that API exists, so it
          # is expected to pass here; if it does not, exclude that one nested class with a comment
          # saying so rather than returning to an allow-list.
          mvn test \
            -Dtest='!MultiThreadTest,!InheritedFlagTest,!*IT,!jp.aegif.nemaki.cmis.tck.**,!AtlasManualDataLoader' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages
      # The independent verifier is a SEPARATE module and would not run under -f core/pom.xml.
      # It carries the claim that a third party can check a package without the product, so a
      # green build that never ran it would be asserting exactly nothing about that claim.
      - name: Run the independent verifier's tests
        run: |
          mvn install -q -f evidence-verifier-core/pom.xml -DskipTests
          mvn test -f evidence-verifier-core/pom.xml
          mvn test -f evidence-verifier-cli/pom.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: unit-test-reports, path: core/target/surefire-reports/, retention-days: 7 }

  # ── Integration tests (require running server) ─────────────
  integration-tests:
    name: VersioningBehaviorTest + InheritedFlagTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run integration tests
        run: |
          mvn test \
            -Dtest='VersioningBehaviorTest,InheritedFlagTest' \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: integration-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── TCK CMIS compliance tests (require running server) ─────
  tck-tests:
    name: TCK CMIS Compliance (38 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run TCK tests
        run: |
          mvn test \
            -Dtest='ConnectionTestGroup,BasicsTestGroup,TypesTestGroup,ControlTestGroup,VersioningTestGroup,CrudTestGroup1,CrudTestGroup2,QueryTestGroup' \
            -Dsurefire.excludes= \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: tck-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── OData binding ITs (require running server) ─────────────
  # Turns the previously @Disabled OData ITs into a real CI gate. They run
  # against the live stack with the JUnit @Disabled condition deactivated, after
  # seeding a few documents so the paging / $orderby regression tests actually
  # execute (they assumeTrue(total >= 2) and would otherwise skip on a fresh DB).
  odata-tests:
    name: OData Binding ITs (Documents/Folders/Olingo-client, 71 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Seed OData test documents
        run: bash "$GITHUB_WORKSPACE/scripts/ci-seed-odata-docs.sh"

      - name: Run OData integration tests
        run: |
          mvn test \
            -Dtest='ODataDocumentsIT,ODataFoldersIT,ODataOlingoClientValidationIT' \
            -Dnemaki.test.baseUrl=http://localhost:8080/core \
            -Djunit.jupiter.conditions.deactivate='*' \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: odata-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── Store-behaviour premises, one job per supported CouchDB line (R7 / A-7) ──
  # The product's floor accepts every line in StoreBehaviourFacts.SUPPORTED_LINES,
  # so a single run measures one of them and leaves the rest as prose. This job
  # asks a BARE couchdb container (no NemakiWare, no Setup Wizard — the IT needs
  # neither) whether each premise the code relies on is true there.
  # required=true, so an unreachable store FAILS instead of assuming past the
  # measurement. EverySupportedCouchDbIsMeasuredTest pins this matrix to the table.
  store-behaviour-facts:
    name: Store-behaviour premises (CouchDB ${{ matrix.couchdb }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A-7: pinned to StoreBehaviourFacts.SUPPORTED_LINES — change both or neither.
        couchdb: ['3.3.3', '3.4.3', '3.5.2']
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    services:
      couchdb:
        image: couchdb:${{ matrix.couchdb }}
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 15984:5984
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Wait for CouchDB ${{ matrix.couchdb }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://admin:password@localhost:15984/ >/dev/null 2>&1; then
              echo "CouchDB answered:"
              curl -fsS http://admin:password@localhost:15984/
              exit 0
            fi
            sleep 2
          done
          echo "CouchDB ${{ matrix.couchdb }} never answered on 15984" >&2
          exit 1

      - name: Build the modules the test tree needs
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q

      - name: Measure the premises against CouchDB ${{ matrix.couchdb }}
        run: |
          mvn test \
            -Dtest='StoreBehaviourFactsIT' \
            -Dnemaki.test.couchdb.required=true \
            -Dnemaki.test.couchdb.url=http://localhost:15984 \
            -Dnemaki.test.couchdb.user=admin \
            -Dnemaki.test.couchdb.password=password \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: store-behaviour-facts-${{ matrix.couchdb }}
          path: core/target/surefire-reports/
          retention-days: 14

  # ── Search-index ACL reconciliation IT (require running CouchDB/Solr) ─────
  # Exercises the durable reconciliation queue's concurrency / durability
  # primitives (deterministic-id dedupe, _rev CAS claim exclusivity, lease loss
  # detection, complete-vs-concurrent-enqueue, Mango status filter, metrics)
  # against a LIVE CouchDB. These are the guarantees the Mockito scheduler test
  # cannot cover. The IT is normally *IT (outside Surefire), and skips locally
  # when nemaki_conf is unreachable — but here it runs with
  # nemaki.test.couchdb.required=true, so an unreachable store FAILS the job
  # instead of silently skipping (no false green).
  reconcile-it:
    name: Search-index ACL reconciliation + ACL-epoch counter IT (live CouchDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → Setup Mode. The Setup Wizard creates the repositories and
          # nemaki_conf, and core startup applies Patch_SearchIndexReconcileMangoIndex
          # (the Mango indexes the queue's claimDue/list use).
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run reconciliation + ACL-epoch counter IT (fail if CouchDB unreachable)
        run: |
          mvn test \
            -Dtest='SearchIndexReconciliationServiceIT,AclEpochCounterServiceIT,Patch_AclEpochCounterIT,AclEpochFinalizationServiceIT,AclEffectiveEpochServiceIT,AclSemanticsCrossImplementationAgreementIT,Patch_AclEpochMutationIdMangoIndexIT,AclEpochIndexWriterIT,PrincipalLookupTriStateIT' \
            -Dnemaki.test.couchdb.required=true \
            -Dnemaki.test.couchdb.url=http://localhost:5984 \
            -Dnemaki.test.couchdb.user=admin \
            -Dnemaki.test.couchdb.password=password \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: reconcile-it-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f
