name: NemakiWare Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop, 'release/**' ]
    paths:
      - 'pom.xml'
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      # The unit job carries a lock that reads the manual-run SCREENS. Without this a
      # UI-only revert does not start this workflow at all, so the lock is on the list
      # and the list never runs for the change it guards.
      - 'core/src/main/webapp/ui/src/**'
      # Every document under docs/. The forbidden-claim lint reads every .md and .json under
      # docs/, so a claim in any of them has to start this workflow (review, P2).
      - 'docs/**'
      # The unit job counts the controls and checks the canon's number against them.
      # Without these, retiring a control or editing that number does not start this
      # workflow, so the check exists and never gates (Codex review, P2).
      - 'tools/negative-controls/**'
      - 'docs/design/fail-closed-reads.md'
      # The evidence profile spec and the vectors both languages read. A change to
      # either is a change to what every external verifier must do.
      - 'docs/design/evidence-profile-v1.md'
      # NOTE: everyDocumentALockReadsStartsTheWorkflow derives paths from core's tests only;
      # documents the verifier modules' locks read (this schema) are listed by hand.
      - 'docs/evidence-profile/v1/**'
      # The progress documents. A lock reads their counts against the canon and the
      # runner, and reads the Phase 0 gate against the profile spec. Editing a number
      # in either of these is exactly the change that has to start this workflow.
      - 'docs/design/v3.4.0-evidence-and-residuals-plan.md'
      - 'docs/design/v3.4-release-readiness.md'
      # E1's scope lock reads the Phase 0 inventory's write-path table.
      - 'docs/design/evidence-phase0-inventory.md'
      # The OPERATOR-facing documents. Three locks in this batch read files under
      # docs/operations/, and the forbidden-claim lint reads docs/operations/ and
      # docs/compliance/ as two of its four shipped roots — none of which were in
      # this list, so a PR deleting the ABSENT row or the 「更新しない」 sentence
      # touched only paths that never start this workflow and went green
      # (subagent review, P2).
      - 'docs/operations/**'
      - 'docs/compliance/**'
      # The independent verifier module, which has its own test step.
      - 'evidence-verifier-core/**'
      - 'evidence-verifier-cli/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'
      - 'scripts/ci-complete-setup.sh'
      - 'scripts/ci-seed-odata-docs.sh'
      # Reader-facing text outside docs/ that the forbidden-claim lint reads, and the release
      # notes two locks read. Only docs/ paths were ever checked, so these never had to start
      # this workflow (subagent review, P2).
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'deploy/**'
      - 'docker/**'
      # What the UI version lock reads besides ui/src (3.4.1).
      - 'core/src/main/webapp/ui/package.json'
      - 'core/src/main/webapp/ui/vite.config.ts'
      # What the release-tool locks read (3.4.1): the OSV check, the SBOM script and the scan settings.
      - 'tools/sbom/**'
      - '.trivyignore.yaml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    # release/** is on the push list, so the gate ran only AFTER a merge into a release branch.
    # A PR onto one did not start this workflow at all (round-4 review, P3).
    branches: [ master, main, develop, 'release/**' ]
    paths:
      - 'pom.xml'
      - 'core/src/main/java/**'
      - 'core/src/test/java/**'
      - 'core/pom.xml'
      - 'core/src/main/webapp/WEB-INF/**'
      # The unit job carries a lock that reads the manual-run SCREENS. Without this a
      # UI-only revert does not start this workflow at all, so the lock is on the list
      # and the list never runs for the change it guards.
      - 'core/src/main/webapp/ui/src/**'
      # Every document under docs/. The forbidden-claim lint reads every .md and .json under
      # docs/, so a claim in any of them has to start this workflow (review, P2).
      - 'docs/**'
      # The unit job counts the controls and checks the canon's number against them.
      # Without these, retiring a control or editing that number does not start this
      # workflow, so the check exists and never gates (Codex review, P2).
      - 'tools/negative-controls/**'
      - 'docs/design/fail-closed-reads.md'
      # The evidence profile spec and the vectors both languages read. A change to
      # either is a change to what every external verifier must do.
      - 'docs/design/evidence-profile-v1.md'
      # NOTE: everyDocumentALockReadsStartsTheWorkflow derives paths from core's tests only;
      # documents the verifier modules' locks read (this schema) are listed by hand.
      - 'docs/evidence-profile/v1/**'
      # The progress documents. A lock reads their counts against the canon and the
      # runner, and reads the Phase 0 gate against the profile spec. Editing a number
      # in either of these is exactly the change that has to start this workflow.
      - 'docs/design/v3.4.0-evidence-and-residuals-plan.md'
      - 'docs/design/v3.4-release-readiness.md'
      # E1's scope lock reads the Phase 0 inventory's write-path table.
      - 'docs/design/evidence-phase0-inventory.md'
      # The OPERATOR-facing documents. Three locks in this batch read files under
      # docs/operations/, and the forbidden-claim lint reads docs/operations/ and
      # docs/compliance/ as two of its four shipped roots — none of which were in
      # this list, so a PR deleting the ABSENT row or the 「更新しない」 sentence
      # touched only paths that never start this workflow and went green
      # (subagent review, P2).
      - 'docs/operations/**'
      - 'docs/compliance/**'
      # The independent verifier module, which has its own test step.
      - 'evidence-verifier-core/**'
      - 'evidence-verifier-cli/**'
      - 'common/**'
      - 'cloudant-init/**'
      - 'solr/**'
      - 'docker/core/**'
      - 'docker/solr/**'
      - 'docker/docker-compose-simple.yml'
      - '.github/workflows/integration-tests.yml'
      - 'scripts/ci-complete-setup.sh'
      - 'scripts/ci-seed-odata-docs.sh'
      # The same reader-facing text outside docs/ as the push trigger.
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'deploy/**'
      - 'docker/**'
      # What the UI version lock reads besides ui/src (3.4.1).
      - 'core/src/main/webapp/ui/package.json'
      - 'core/src/main/webapp/ui/vite.config.ts'
      # What the release-tool locks read (3.4.1): the OSV check, the SBOM script and the scan settings.
      - 'tools/sbom/**'
      - '.trivyignore.yaml'
      - '.github/workflows/security-scan.yml'

permissions:
  contents: read
  packages: read   # resolve custom OpenCMIS 1.1.0-nemakiware from GitHub Packages

jobs:
  # ── Fast unit tests (no server needed) ─────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # The whole suite, not 81 classes: locally 3m20s on 10 cores, and this runner has 2 — plus the
    # sibling modules' install and the verifier's own tests in the same job. Raised with the exclusion
    # list; the first real run is what settles it (round-3 review, P3).
    timeout-minutes: 45
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build sibling modules
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
      # A shell step, not a Java test, and it must stay that way: a Java lock cannot observe its own
      # exclusion — exclude the class and the test that would have complained is the one that no longer
      # runs (both round-4 reviews, P1).
      #
      # It asserts the unit job's -Dtest is EXACTLY the documented list. Checking "every entry starts
      # with !" was not enough: `-Dtest='!jp.aegif.nemaki.**'` is all exclusions, selects no core test at
      # all, and with failIfNoSpecifiedTests=false the job then SUCCEEDS with zero tests — every lock in
      # the suite gone, CI green (round-3 review, P1). An exact match means widening the exclusions is a
      # deliberate edit here as well as there, which is where review can see it.
      #
      # It does NOT protect against deleting the step itself — that is visible in the diff.
      - name: The unit job runs the whole suite, not a chosen list
        run: |
          set -eu
          EXPECTED="!MultiThreadTest,!InheritedFlagTest,!*IT,!jp.aegif.nemaki.cmis.tck.**,!AtlasManualDataLoader"
          # Scoped to THIS job by name, not by position, and anchored to the start of a line so this
          # step's own text is not what gets read. The range ends at the next two-space key.
          LIST=$(sed -n '/^  unit-tests:/,/^  [a-z]/p' .github/workflows/integration-tests.yml \
                 | grep -oE "^ +-Dtest='[^']*'" | head -1)
          if [ -z "$LIST" ]; then
            echo "::error::no -Dtest list found inside the unit-tests job"; exit 1
          fi
          ACTUAL=$(printf '%s' "$LIST" | sed "s/^ *-Dtest='//; s/'$//")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::the unit job's -Dtest is not the documented whole-suite list."
            echo "::error::expected: $EXPECTED"
            echo "::error::actual:   $ACTUAL"
            echo "::error::This job must run the whole suite so a lock added with a batch runs without"
            echo "::error::being listed. Do not allow-list, and do not widen the exclusions (a package"
            echo "::error::exclusion such as !jp.aegif.nemaki.** selects nothing and would pass green)."
            echo "::error::If an exclusion really has to change, change EXPECTED here in the same commit."
            exit 1
          fi
          echo "the unit job runs the whole suite; exclusions exactly as documented: $ACTUAL"

          # -Dtest is not the only selection: core/pom.xml configures surefire <excludes> and
          # <excludedGroups> too, and none of the checks here used to read them. One line there
          # (<exclude>**/evidence/**</exclude>) removes ~495 tests — the document and claim locks among
          # them — and every check above still passes, the floor included (round-4 review, P2).
          # Scoped to the surefire plugin: the pom has several <excludes> blocks (enforcer, resources,
          # war), and reading them all made this check compare the wrong list (measured).
          POM_SUREFIRE=$(sed -n '/maven-surefire-plugin/,/<\/plugin>/p' core/pom.xml)
          POM_EXCLUDES=$(printf '%s' "$POM_SUREFIRE" \
                         | grep -oE '<exclude>[^<]*</exclude>' | sed 's/<[^>]*>//g' | tr '\n' ' ' | sed 's/ $//')
          POM_GROUPS=$(printf '%s' "$POM_SUREFIRE" \
                       | grep -oE '<excludedGroups>[^<]*</excludedGroups>' | sed 's/<[^>]*>//g')
          EXPECTED_POM_EXCLUDES="**/test/tests/** **/test/compatibility/** **/*\$*"
          EXPECTED_POM_GROUPS='${surefire.excludedGroups}'
          if [ "$POM_GROUPS" != "$EXPECTED_POM_GROUPS" ]; then
            echo "::error::core/pom.xml's surefire <excludedGroups> is not what this job expects."
            echo "::error::expected: $EXPECTED_POM_GROUPS"
            echo "::error::actual:   $POM_GROUPS"
            exit 1
          fi
          if [ "$POM_EXCLUDES" != "$EXPECTED_POM_EXCLUDES" ]; then
            echo "::error::core/pom.xml's surefire <excludes> is not what this job expects."
            echo "::error::expected: $EXPECTED_POM_EXCLUDES"
            echo "::error::actual:   $POM_EXCLUDES"
            echo "::error::An exclusion added there removes tests without changing -Dtest, so none of the"
            echo "::error::checks in this job would notice. Change EXPECTED_POM_EXCLUDES in the same commit."
            exit 1
          fi
          echo "core/pom.xml's surefire selection is as documented: excludes [$POM_EXCLUDES] groups [$POM_GROUPS]"

          # Named-and-not-running, the two ways the old allow-list step also checked. They still apply
          # under an exclusion list: a class runs without being named, but a RENAME or a @Disabled takes
          # it out silently and neither the exact-list check above nor a Java lock can see it (the Java
          # lock is in the suite; @Disabled on it is exactly how it stops running — round-3 review, P2).
          LOCKS="EverySupportedCouchDbIsMeasuredTest
                 CanonicalImportServiceTest
                 ReleaseReadinessIsMeasuredTest
                 NoForbiddenClaimShipsTest
                 CredentialsEndWithTheAccountTest
                 TheAssertedNameIsNotTheAuthenticatedOneTest
                 OidcLoginTest
                 OidcLoginEntryPointsTest
                 IsNullNamesTheSolrFieldTest
                 SelfServiceCannotGrantOrResetWithoutTheOldPasswordTest"
          for lock in $LOCKS; do
            FILE=$(find core/src/test/java -name "$lock.java" -print -quit)
            if [ -z "$FILE" ]; then
              echo "::error::$lock does not exist — renamed or deleted, so nothing in it runs here"
              exit 1
            fi
            # The CLASS being disabled, which is what silences the whole lock. Three things this has to
            # get right (round-4 review, P3): the inherited '^@Disabled' let
            # @org.junit.jupiter.api.Disabled past; a bare 'Disabled' prefix also matches @DisabledOnOs
            # and @DisabledIfEnvironmentVariable, which would fail the job for the wrong reason; and the
            # annotation can sit on the class line itself. So: the annotation must be Disabled exactly
            # (end of name), and it must be on a line that declares the class or immediately precedes one.
            if grep -qE '^[[:space:]]*@(org\.junit\.jupiter\.api\.)?Disabled([[:space:]]*\(|[[:space:]]*$)' "$FILE" \
               || grep -qE '^[[:space:]]*(public[[:space:]]+)?@(org\.junit\.jupiter\.api\.)?Disabled([[:space:]]*\([^)]*\))?[[:space:]]+(public[[:space:]]+)?(final[[:space:]]+)?class[[:space:]]' "$FILE"; then
              echo "::error::$lock exists but the class is @Disabled, so nothing in it runs here"
              exit 1
            fi
          done
          echo "all $(printf '%s\n' $LOCKS | wc -l | tr -d ' ') named locks exist and none is @Disabled"

      - name: Run unit tests
        run: |
          # THE WHOLE SUITE, by exclusion. This was a positive allow-list naming 81 classes (measured:
          # the old -Dtest split on "," and de-duplicated) against 662 *Test.java files, so a lock added
          # with a batch did not run here until someone remembered to add its name — and the locks this
          # release added for the authentication fixes were not in it (external review T1, and our own
          # review raised the same gap). An exclusion list cannot go stale that way: a new test class runs
          # unless it is named here. (The external review said "~125 of 637"; both figures are measured
          # above as 81 and 662 — round-3 review, P3.)
          #
          # What is excluded and why:
          #   InheritedFlagTest                   — run in the integration job below, against a server
          #   MultiThreadTest                     — needs a running server, and NO job runs it today
          #                                         (round-3 review, P2: the comment used to say it ran
          #                                         below; it appears only in this exclusion). Recorded
          #                                         as a residual rather than wired up unmeasured.
          #   *IT, jp.aegif.nemaki.cmis.tck.**    — integration / TCK, need a running stack
          #   AtlasManualDataLoader               — a manual data loader, not a test
          # This is the same list the release gate runs locally (CLAUDE.md).
          #
          # NOTE, unverified until this job first runs: on macOS + JDK 21 the local gate sees one
          # error — LineageBarrierTest$FrozenFormulas gets UnmeasurableException because that
          # platform has no SecureDirectoryStream. This runner is Linux, where that API exists, so it
          # is expected to pass here; if it does not, exclude that one nested class with a comment
          # saying so rather than returning to an allow-list.
          # failure.ignore=false explicitly: with it true, Maven exits 0 even when locks go red, and every
          # guard in this job still passes — the exact -Dtest list, the classes exist, none is @Disabled,
          # and 8,147 tests "ran" (round-4 review, P1). Stating it here means turning it on is an edit to
          # this line, in the diff.
          mvn test \
            -Dtest='!MultiThreadTest,!InheritedFlagTest,!*IT,!jp.aegif.nemaki.cmis.tck.**,!AtlasManualDataLoader' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dmaven.test.failure.ignore=false \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages
      # Zero tests is not a pass. failIfNoSpecifiedTests=false (above) is there so an exclusion-only
      # -Dtest does not fail the plugin, but it also means a selection that matches NOTHING succeeds.
      # This reads what actually ran, so it holds however the selection was edited — and it does not
      # depend on any particular lock having been selected (round-3 review, P1).
      - name: The suite actually ran
        run: |
          set -eu
          REPORTS=core/target/surefire-reports
          if [ ! -d "$REPORTS" ]; then
            echo "::error::no surefire reports at $REPORTS — the unit job selected no tests at all"; exit 1
          fi
          # tests= INCLUDES skipped (measured: a @Disabled method gave tests="5" skipped="1"), so a
          # suite silenced with @Disabled would keep the count up. Subtract them.
          COUNTED=$(grep -ho 'tests="[0-9]*"' "$REPORTS"/TEST-*.xml 2>/dev/null \
                | grep -oE '[0-9]+' | awk '{n+=$1} END {print n+0}')
          SKIPPED=$(grep -ho 'skipped="[0-9]*"' "$REPORTS"/TEST-*.xml 2>/dev/null \
                | grep -oE '[0-9]+' | awk '{n+=$1} END {print n+0}')
          RAN=$((COUNTED - SKIPPED))
          # Read the outcome too, not only the count. Counting alone passed a run where every lock was red
          # and Maven had been told to ignore that (round-4 review, P1): 8,147 tests "ran" and the step was
          # happy. This is independent of Maven's exit code on purpose.
          BAD=$(grep -ho -E '(failures|errors)="[0-9]*"' "$REPORTS"/TEST-*.xml 2>/dev/null \
                | grep -oE '[0-9]+' | awk '{n+=$1} END {print n+0}')
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD unit test failures/errors are recorded in the surefire reports."
            echo "::error::If the build still succeeded, something is ignoring test failures."
            exit 1
          fi
          # A FLOOR, far below the real total (8,140 at 3.4.1) and far above zero. It is not the total:
          # a figure that has to be bumped with every added test is a figure that goes stale, and the
          # readiness document is where the real count is recorded and locked.
          FLOOR=7000
          if [ "$RAN" -lt "$FLOOR" ]; then
            echo "::error::only $RAN unit tests ran ($COUNTED counted - $SKIPPED skipped; floor $FLOOR)."
            echo "::error::The selection matched almost nothing, or the suite was silenced,"
            echo "::error::which succeeds silently with failIfNoSpecifiedTests=false. Check the -Dtest list."
            exit 1
          fi
          echo "unit tests that ran: $RAN ($COUNTED counted - $SKIPPED skipped; floor $FLOOR)"
      # The independent verifier is a SEPARATE module and would not run under -f core/pom.xml.
      # It carries the claim that a third party can check a package without the product, so a
      # green build that never ran it would be asserting exactly nothing about that claim.
      - name: Run the independent verifier's tests
        run: |
          mvn install -q -f evidence-verifier-core/pom.xml -DskipTests
          mvn test -f evidence-verifier-core/pom.xml
          mvn test -f evidence-verifier-cli/pom.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: unit-test-reports, path: core/target/surefire-reports/, retention-days: 7 }

  # ── Integration tests (require running server) ─────────────
  integration-tests:
    name: VersioningBehaviorTest + InheritedFlagTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run integration tests
        run: |
          mvn test \
            -Dtest='VersioningBehaviorTest,InheritedFlagTest' \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: integration-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── TCK CMIS compliance tests (require running server) ─────
  tck-tests:
    name: TCK CMIS Compliance (38 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run TCK tests
        run: |
          mvn test \
            -Dtest='ConnectionTestGroup,BasicsTestGroup,TypesTestGroup,ControlTestGroup,VersioningTestGroup,CrudTestGroup1,CrudTestGroup2,QueryTestGroup' \
            -Dsurefire.excludes= \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: tck-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── OData binding ITs (require running server) ─────────────
  # Turns the previously @Disabled OData ITs into a real CI gate. They run
  # against the live stack with the JUnit @Disabled condition deactivated, after
  # seeding a few documents so the paging / $orderby regression tests actually
  # execute (they assumeTrue(total >= 2) and would otherwise skip on a fresh DB).
  odata-tests:
    name: OData Binding ITs (Documents/Folders/Olingo-client, 71 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down,
      # so the Cleanup step (compose down) needs them too.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
          # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Seed OData test documents
        run: bash "$GITHUB_WORKSPACE/scripts/ci-seed-odata-docs.sh"

      - name: Run OData integration tests
        run: |
          mvn test \
            -Dtest='ODataDocumentsIT,ODataFoldersIT,ODataOlingoClientValidationIT' \
            -Dnemaki.test.baseUrl=http://localhost:8080/core \
            -Djunit.jupiter.conditions.deactivate='*' \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: odata-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f

  # ── Store-behaviour premises, one job per supported CouchDB line (R7 / A-7) ──
  # The product's floor accepts every line in StoreBehaviourFacts.SUPPORTED_LINES,
  # so a single run measures one of them and leaves the rest as prose. This job
  # asks a BARE couchdb container (no NemakiWare, no Setup Wizard — the IT needs
  # neither) whether each premise the code relies on is true there.
  # required=true, so an unreachable store FAILS instead of assuming past the
  # measurement. EverySupportedCouchDbIsMeasuredTest pins this matrix to the table.
  store-behaviour-facts:
    name: Store-behaviour premises (CouchDB ${{ matrix.couchdb }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A-7: pinned to StoreBehaviourFacts.SUPPORTED_LINES — change both or neither.
        couchdb: ['3.3.3', '3.4.3', '3.5.2']
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    services:
      couchdb:
        image: couchdb:${{ matrix.couchdb }}
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 15984:5984
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Wait for CouchDB ${{ matrix.couchdb }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://admin:password@localhost:15984/ >/dev/null 2>&1; then
              echo "CouchDB answered:"
              curl -fsS http://admin:password@localhost:15984/
              exit 0
            fi
            sleep 2
          done
          echo "CouchDB ${{ matrix.couchdb }} never answered on 15984" >&2
          exit 1

      - name: Build the modules the test tree needs
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q

      - name: Measure the premises against CouchDB ${{ matrix.couchdb }}
        run: |
          mvn test \
            -Dtest='StoreBehaviourFactsIT' \
            -Dnemaki.test.couchdb.required=true \
            -Dnemaki.test.couchdb.url=http://localhost:15984 \
            -Dnemaki.test.couchdb.user=admin \
            -Dnemaki.test.couchdb.password=password \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: store-behaviour-facts-${{ matrix.couchdb }}
          path: core/target/surefire-reports/
          retention-days: 14

  # ── Search-index ACL reconciliation IT (require running CouchDB/Solr) ─────
  # Exercises the durable reconciliation queue's concurrency / durability
  # primitives (deterministic-id dedupe, _rev CAS claim exclusivity, lease loss
  # detection, complete-vs-concurrent-enqueue, Mango status filter, metrics)
  # against a LIVE CouchDB. These are the guarantees the Mockito scheduler test
  # cannot cover. The IT is normally *IT (outside Surefire), and skips locally
  # when nemaki_conf is unreachable — but here it runs with
  # nemaki.test.couchdb.required=true, so an unreachable store FAILS the job
  # instead of silently skipping (no false green).
  reconcile-it:
    name: Search-index ACL reconciliation + ACL-epoch counter IT (live CouchDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build NemakiWare
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
          mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

      - name: Start NemakiWare Server
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        run: |
          cd docker
          cp ../core/target/core.war core/core.war
          docker compose -f docker-compose-simple.yml up -d --build

          # Fresh CouchDB → Setup Mode. The Setup Wizard creates the repositories and
          # nemaki_conf, and core startup applies Patch_SearchIndexReconcileMangoIndex
          # (the Mango indexes the queue's claimDue/list use).
          COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

      - name: Run reconciliation + ACL-epoch counter IT (fail if CouchDB unreachable)
        run: |
          mvn test \
            -Dtest='SearchIndexReconciliationServiceIT,AclEpochCounterServiceIT,Patch_AclEpochCounterIT,AclEpochFinalizationServiceIT,AclEffectiveEpochServiceIT,AclSemanticsCrossImplementationAgreementIT,Patch_AclEpochMutationIdMangoIndexIT,AclEpochIndexWriterIT,PrincipalLookupTriStateIT' \
            -Dnemaki.test.couchdb.required=true \
            -Dnemaki.test.couchdb.url=http://localhost:5984 \
            -Dnemaki.test.couchdb.user=admin \
            -Dnemaki.test.couchdb.password=password \
            -f core/pom.xml -Pdevelopment,opencmis-github-packages \
            -Dmaven.test.failure.ignore=false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: reconcile-it-reports, path: core/target/surefire-reports/, retention-days: 14 }

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-simple.yml down
          docker system prune -f
