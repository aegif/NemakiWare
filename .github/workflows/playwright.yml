name: Playwright Tests

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
    paths:
      - 'core/src/main/webapp/ui/**'
      - 'core/src/main/java/**'
      - 'core/pom.xml'
      - 'common/**'
      - 'solr/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master, develop, 'release/**' ]
    paths:
      - 'core/src/main/webapp/ui/**'
      - 'core/src/main/java/**'
      - 'core/pom.xml'
      - 'common/**'
      - 'solr/**'
      - '.github/workflows/playwright.yml'

permissions:
  contents: read
  packages: read   # resolve custom OpenCMIS 1.1.0-nemakiware from GitHub Packages

jobs:
  test:
    # 3.3.1 #9b: sharded 4 ways. Each shard boots its OWN full stack (CouchDB/Solr/core),
    # so cross-shard interference through server state is impossible and workers:1 inside a
    # shard keeps the suite's ordering assumptions. Unsharded green runs took 87-103 minutes;
    # a shard carries the full build+boot (~25 min) plus about a quarter of the tests, so 75
    # keeps headroom while a hung shard dies far sooner than the old 130/180. fail-fast is
    # off so one flaky shard does not cancel the other three-quarters of the signal.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # docker-compose-simple.yml requires these (?:- fail-fast) for up AND down.
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Java 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github-opencmis
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: core/src/main/webapp/ui/package-lock.json

    - name: Install UI dependencies
      working-directory: core/src/main/webapp/ui
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: core/src/main/webapp/ui
      run: npx playwright install --with-deps

    - name: Build NemakiWare Dependencies
      run: |
        # Build parent POM first
        echo "Installing parent POM..."
        mvn clean install -N -DskipTests -q
        
        # Build dependency modules
        echo "Building common module..."
        mvn clean install -f common/pom.xml -DskipTests -q
        
        echo "Building cloudant-init module..."
        mvn clean install -f cloudant-init/pom.xml -DskipTests -q
        
        echo "Building solr module..."

    - name: Build UI
      working-directory: core/src/main/webapp/ui
      run: npm run build

    - name: Build NemakiWare Core (includes UI assets)
      run: |
        mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

    - name: Start NemakiWare Backend
      env:
        # docker-compose-simple.yml requires these to be set (?:- fail-fast).
        # CI uses fixed test credentials; production deployments must
        # supply strong values via secrets / .env.
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: password
      run: |
        cd docker
        cp ../core/target/core.war core/core.war
        docker compose -f docker-compose-simple.yml up -d --build

        # Fresh CouchDB → NemakiWare enters Setup Mode (no admin until the
        # Setup Wizard runs). Drive it via the Setup API so admin:admin works.
        COMPOSE_FILE=docker-compose-simple.yml bash "$GITHUB_WORKSPACE/scripts/ci-complete-setup.sh"

        echo "Waiting for UI assets..."
        timeout 120s bash -c 'while ! curl -f http://localhost:8080/core/ui/ >/dev/null 2>&1; do sleep 3; done'
        echo "✅ NemakiWare server is fully ready"

    - name: Run Playwright tests
      working-directory: core/src/main/webapp/ui
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:8080
        SKIP_KEYCLOAK: 'true'
      # github + html: --reporter on the CLI REPLACES the config's reporter list, so github
      # alone left the playwright-report/ artifact empty (pre-existing, surfaced in review).
      run: npx playwright test --project=chromium --reporter=github,html --shard=${{ matrix.shard }}/4

    - name: Upload Playwright Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: core/src/main/webapp/ui/playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: test-results-shard-${{ matrix.shard }}
        path: core/src/main/webapp/ui/test-results/
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        cd docker
        docker compose -f docker-compose-simple.yml down
        docker system prune -f
