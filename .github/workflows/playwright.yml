name: Playwright Tests

on:
  push:
    branches: [ main, master, develop, 'release/**' ]
    paths:
      - 'core/src/main/webapp/ui/**'
  pull_request:
    branches: [ main, master, develop, 'release/**' ]
    paths:
      - 'core/src/main/webapp/ui/**'

permissions:
  contents: read
  packages: read   # resolve custom OpenCMIS 1.1.0-nemakiware from GitHub Packages

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        server-id: github-opencmis
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: core/src/main/webapp/ui/package-lock.json

    - name: Install UI dependencies
      working-directory: core/src/main/webapp/ui
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: core/src/main/webapp/ui
      run: npx playwright install --with-deps

    - name: Build NemakiWare Dependencies
      run: |
        # Build parent POM first
        echo "Installing parent POM..."
        mvn clean install -N -DskipTests -q
        
        # Build dependency modules
        echo "Building common module..."
        mvn clean install -f common/pom.xml -DskipTests -q
        
        echo "Building cloudant-init module..."
        mvn clean install -f cloudant-init/pom.xml -DskipTests -q
        
        echo "Building solr module..."
        mvn clean install -f solr/pom.xml -DskipTests -q

    - name: Build UI
      working-directory: core/src/main/webapp/ui
      run: npm run build

    - name: Build NemakiWare Core (includes UI assets)
      run: |
        mvn clean package -f core/pom.xml -Pdevelopment,opencmis-github-packages -DskipTests -q

    - name: Start NemakiWare Backend
      env:
        # docker-compose-simple.yml requires these to be set (?:- fail-fast).
        # CI uses fixed test credentials; production deployments must
        # supply strong values via secrets / .env.
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: password
      run: |
        cd docker
        cp ../core/target/core.war core/core.war
        docker compose -f docker-compose-simple.yml up -d --build

        # Wait for backend (CMIS + CouchDB) AND UI assets to be ready
        timeout 300s bash -c '
          echo "Waiting for backend API..."
          while ! curl -f -u admin:admin http://localhost:8080/core/atom/bedroom >/dev/null 2>&1; do
            sleep 5
          done
          echo "✅ Backend API is ready"
          echo "Waiting for UI assets..."
          while ! curl -f http://localhost:8080/core/ui/ >/dev/null 2>&1; do
            sleep 3
          done
          echo "✅ UI assets are ready"
        '

        echo "✅ NemakiWare server is fully ready"

    - name: Run Playwright tests
      working-directory: core/src/main/webapp/ui
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:8080
        SKIP_KEYCLOAK: 'true'
      run: npx playwright test --project=chromium --reporter=github

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: core/src/main/webapp/ui/playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: core/src/main/webapp/ui/test-results/
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        cd docker
        docker compose -f docker-compose-simple.yml down
        docker system prune -f
