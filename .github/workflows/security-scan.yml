name: Security Scan

# Continuous dependency vulnerability surveillance.
#
# Runs on:
#   - every push / PR that touches dependency manifests
#   - daily at 02:00 UTC (catches newly disclosed CVEs against pinned versions)
#
# What it checks:
#   1. npm audit (frontend) — fails on any high/critical vulnerability
#   2. Maven dependency:tree drift — flags reintroduction of known-bad
#      versions (junit:compile, xml-apis, logback < 1.5.19, netty < 4.1.136,
#      httpclient < 4.5.14, etc.)
#   3. Plaintext credential drift — fails if hardcoded admin/password
#      patterns reappear in compose files / properties
#   4. OSV dependency scan (osv-scanner) — cross-ecosystem CVE lookup over
#      every pom.xml + package-lock.json against the OSV.dev database, so a
#      newly disclosed CVE against a pinned version surfaces without waiting
#      for a hand-written denylist entry (informational — does not block)
#   5. Trivy container-image scan — builds the Solr image and fails on
#      fixable HIGH/CRITICAL OS/library CVEs, closing the gap where the
#      hand-maintained Maven denylist never saw the runtime base image
#      (this is exactly how the Solr 9.10.0 -> 9.10.1 CVE-2025-66516 lag
#      would have been caught)
#
# The hand-written Maven denylist (job 2) stays as a fast, deterministic
# floor; OSV + Trivy add dynamic, database-backed coverage on top.
#
# This is an early-warning system: the drift/credential/Trivy checks fail
# (red) on regressions; the OSV job is informational. Failures don't block
# merges automatically, but the GitHub UI shows red checks so reviewers see
# them. To make it blocking, mark the workflow required in branch
# protection settings.

on:
  push:
    branches: [ master, main, develop, 'release/**' ]
    paths:
      - '**/pom.xml'
      - 'core/src/main/webapp/ui/package.json'
      - 'core/src/main/webapp/ui/package-lock.json'
      - 'docker/**/*.yml'
      - 'docker/**/Dockerfile*'
      - 'docker/**/*.properties'
      - '.github/workflows/security-scan.yml'
      - 'osv-scanner.toml'
      - '.trivyignore.yaml'
      - 'SECURITY-EXCEPTIONS.md'
      # Source paths so the XML-hardening / credential gates also run on
      # code-only PRs (previously they were skipped when no manifest changed).
      - 'core/src/main/java/**'
      - 'common/src/main/java/**'
  pull_request:
    # No paths filter on PRs: the gating jobs (credential drift, XML-hardening,
    # exception-expiry, dependency drift, npm audit, bundled-jar) run on EVERY
    # PR so they can be marked as required status checks without a
    # never-satisfied "pending" on PRs that don't touch a filtered path.
    branches: [ master, main, develop, 'release/**' ]
  schedule:
    # Daily 02:00 UTC == 11:00 JST
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: core/src/main/webapp/ui/package-lock.json
      - name: Install dependencies (no audit on install)
        working-directory: core/src/main/webapp/ui
        run: npm ci --no-audit
      - name: npm audit — production deps, fail on high/critical
        working-directory: core/src/main/webapp/ui
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — full report (informational)
        if: always()
        working-directory: core/src/main/webapp/ui
        run: npm audit --json > ../../../../npm-audit.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  maven-dep-check:
    name: Maven dependency drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # resolve custom OpenCMIS 1.1.0-nemakiware from GitHub Packages
    env:
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github-opencmis
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Build sibling modules (install to local repo)
        run: |
          mvn clean install -N -DskipTests -q
          mvn clean install -f common/pom.xml -DskipTests -q
          mvn clean install -f cloudant-init/pom.xml -DskipTests -q
      - name: Resolve dependency tree
        run: |
          mvn -f core/pom.xml -Pdevelopment,opencmis-github-packages dependency:tree \
            -DoutputFile=maven-deps.txt -q
          echo "--- Resolved dependencies (security-relevant) ---"
          grep -E "(netty|logback|jackson|spring|httpclient|cxf|commons-io|commons-text|junit|xml-apis|tika|solr-core)" maven-deps.txt | sort -u
      - name: Drift checks — fail if pinned versions regress
        run: |
          set -e
          fail=0

          # Helper: assert the tree does NOT contain a forbidden pattern
          deny() {
            local pattern="$1"
            local reason="$2"
            if grep -qE "$pattern" maven-deps.txt; then
              echo "::error title=Dependency regression::Found '$pattern' — $reason"
              grep -E "$pattern" maven-deps.txt | sed 's/^/  /'
              fail=1
            fi
          }

          # 1. junit:junit must NEVER be compile-scoped (test only)
          deny 'junit:junit:jar:.*:compile' \
            'junit:junit must be test-scoped (DM enforces this; mockwebserver exclusion required)'

          # 2. xml-apis is removed (Java 9+ ships java.xml)
          deny 'xml-apis:xml-apis:jar:' \
            'xml-apis was removed (replaced by JDK java.xml). dom4j exclusion prevents transitive re-introduction'

          # 3. netty regression check (must be >= 4.1.136 — 4.1.136 closes the
          #    CVSS-10 DNS-cache-poisoning issue on top of CVE-2025-55163)
          if grep -qE 'io\.netty:[^:]*:jar:4\.1\.([0-9]|[1-9][0-9]|1[0-2][0-9]|13[0-5])\.Final' maven-deps.txt; then
            echo "::error title=netty regression::netty < 4.1.136.Final detected (CVE-2025-55163 + DNS cache poisoning)"
            grep -E 'io\.netty:[^:]*:jar:4\.1\.([0-9]|[1-9][0-9]|1[0-2][0-9]|13[0-5])\.Final' maven-deps.txt | sed 's/^/  /'
            fail=1
          fi

          # 4. logback regression check (must be >= 1.5.19)
          if grep -qE 'ch\.qos\.logback:logback-(core|classic):jar:1\.5\.(1[0-8]|[0-9]):' maven-deps.txt; then
            echo "::error title=logback regression::logback < 1.5.19 detected (CVE-2025-11226)"
            grep -E 'ch\.qos\.logback:logback-(core|classic):jar:1\.5\.(1[0-8]|[0-9]):' maven-deps.txt | sed 's/^/  /'
            fail=1
          fi

          # 5. httpclient 4.x regression (must be >= 4.5.14)
          if grep -qE 'org\.apache\.httpcomponents:httpclient:jar:4\.5\.1[0-3]:' maven-deps.txt; then
            echo "::error title=httpclient regression::httpclient < 4.5.14 detected (CVE-2020-13956)"
            grep -E 'org\.apache\.httpcomponents:httpclient:jar:4\.5\.1[0-3]:' maven-deps.txt | sed 's/^/  /'
            fail=1
          fi

          # 6. commons-io regression (must be >= 2.20.0)
          if grep -qE 'commons-io:commons-io:jar:2\.(1[0-9])\.' maven-deps.txt; then
            echo "::error title=commons-io regression::commons-io < 2.20.0 detected (CVE-2024-47554)"
            grep -E 'commons-io:commons-io:jar:2\.(1[0-9])\.' maven-deps.txt | sed 's/^/  /'
            fail=1
          fi

          if [ $fail -ne 0 ]; then
            echo ""
            echo "One or more dependency drift checks failed. See ::error annotations above."
            exit 1
          fi
          echo "✅ All dependency drift checks passed."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: maven-deps-tree
          path: maven-deps.txt
          retention-days: 30

  config-credential-check:
    name: Config credential drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Scan for hardcoded credentials in compose / properties
        run: |
          set -e
          fail=0

          # docker compose files: COUCHDB defaults must always be ?:- (required), never :- (default)
          if grep -nE 'COUCHDB_(USER|PASSWORD):-' docker/docker-compose-*.yml; then
            echo "::error title=Credential fallback::COUCHDB_USER/PASSWORD fallback default detected — must use \${VAR:?...} form to fail-fast"
            fail=1
          fi

          # The files these checks watch must exist — a rename/removal would otherwise
          # silently turn every check below into a no-op that always passes.
          for watched in docker/core/nemakiware.properties; do
            if [ ! -f "$watched" ]; then
              echo "::error title=Watched file missing::$watched is gone — the credential checks below no longer cover anything. Update the scan alongside the move."
              fail=1
            fi
          done

          # docker/core/nemakiware.properties must NOT have hardcoded LDAP password
          # (\s* on both sides: java.util.Properties accepts 'key = value' too)
          if grep -nE '^directory\.sync\.ldap\.bind\.password\s*=\s*[^[:space:]]+' docker/core/nemakiware.properties; then
            echo "::error title=Credential leak::docker/core/nemakiware.properties has a non-empty hardcoded LDAP bind password"
            fail=1
          fi

          # Shipped defaults must not carry a tenant identity or arm a scheduled job.
          # This shipped in 3.1.0-3.2.8 with the maintainer's own Workspace domain and
          # admin email baked into the published image, and a cron armed for 02:00 daily.
          if grep -nE '^cloud\.directory\.sync\.enabled\s*=\s*true' docker/core/nemakiware.properties; then
            echo "::error title=Shipped default::cloud directory sync is ENABLED in the shipped image defaults — it must be opt-in"
            fail=1
          fi
          if grep -nE '^cloud\.directory\.sync\.(providers|google\.(domain|adminEmail|serviceAccountKey)|microsoft\.(tenantId|clientId|clientSecret))\s*=\s*[^[:space:]]+' docker/core/nemakiware.properties; then
            echo "::error title=Identity leak::docker/core/nemakiware.properties carries a non-empty cloud directory sync identity — these must ship blank"
            fail=1
          fi

          # No legacy properties files should be re-introduced
          for legacy in docker/nemakiware.properties docker/log4j.properties \
                       docker/ui-war/nemakiware_ui.properties \
                       docker/solr/solr/conf/repositories.yml \
                       docker/solr/solr/conf/nemakisolr.properties; do
            if [ -e "$legacy" ]; then
              echo "::error title=Legacy file re-introduced::$legacy was deleted in RC13 and should not be reinstated (contained hardcoded credentials)"
              fail=1
            fi
          done

          # No jars should appear under nemaki/lib or token/lib. Solr 9
          # auto-loads these directories, and any bundled jar (including
          # the legacy solr-with-dependencies.jar fat jar) reintroduces
          # the stale logback/netty/cxf/jackson-databind classes the
          # remediation tried to remove.
          stray_jars=$(find docker/solr/solr/nemaki/lib docker/solr/solr/token/lib -name '*.jar' 2>/dev/null || true)
          if [ -n "$stray_jars" ]; then
            echo "::error title=Solr lib regression::Jar files appeared under docker/solr/solr/{nemaki,token}/lib — these are auto-loaded by Solr and may carry stale dependency classes"
            echo "$stray_jars" | sed 's/^/  /'
            fail=1
          fi

          if [ $fail -ne 0 ]; then
            exit 1
          fi
          echo "✅ Config credential checks passed."

  bundled-jar-scan:
    name: Bundled jar staleness scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Forbid the SolrCell /update/extract handler (XXE surface)
        # NemakiWare extracts document text application-side with Tika and posts
        # plain text via /update; the in-Solr ExtractingRequestHandler (SolrCell)
        # was removed to eliminate the SolrCell XXE/CVE class (CVE-2025-66516).
        # Fail if an ACTIVE handler or extraction <lib> is reintroduced
        # (commented-out references and prose are allowed).
        run: |
          set -e
          if grep -rniE 'class="solr\.extraction\.ExtractingRequestHandler"' docker/solr/solr \
             | grep -vE '^\s*[^:]+:\s*<!--'; then
            echo "::error title=SolrCell reintroduced::An active ExtractingRequestHandler (/update/extract) was found under docker/solr — do not re-enable in-Solr Tika extraction; index pre-extracted text instead."
            exit 1
          fi
          if grep -rnE '^\s*<lib dir="[^"]*contrib/extraction' docker/solr/solr; then
            echo "::error title=SolrCell lib reintroduced::An active extraction contrib <lib> was found under docker/solr."
            exit 1
          fi
          echo "OK: no active SolrCell handler / extraction lib under docker/solr."
      - name: Forbid any jar under docker/solr (tracked or untracked)
        # Strict policy: docker/solr/ must contain only Dockerfile, pom.xml,
        # assembly descriptors, and Solr core configs. The Solr image is
        # built from solr:10.0.0-slim plus our config tree — never from
        # bundled jars. Any jar here either:
        #   (a) shaded fat jar carrying stale dependency classes
        #       (e.g., the deleted solr-with-dependencies.jar, which embedded
        #       logback 1.4.14 / netty 4.1.105 / cxf 3.0.12 / jackson-databind
        #       2.8.11.6 / commons-io 2.11.0), or
        #   (b) individual lib jar that bypasses Maven dependency management
        #       and the maven-dep-check drift gates.
        # Both are forbidden. Find catches both tracked and untracked files.
        run: |
          set -e
          stray=$(find docker/solr -type f -name '*.jar' 2>/dev/null || true)
          if [ -n "$stray" ]; then
            echo "::error title=Forbidden jar under docker/solr::No jar files allowed in docker/solr — Solr 9 auto-loads core lib/ jars and shaded jars carry stale dependency classes that bypass the maven-dep-check drift gates"
            echo "$stray" | sed 's/^/  /'
            exit 1
          fi
          echo "✅ No jars in docker/solr (strict policy enforced)."

      - name: Defense-in-depth — pom.properties drift parser
        # Reserved for future scope. If a jar ever needs to live under
        # docker/, we must extract groupId/artifactId/version from each
        # bundled META-INF/maven/**/pom.properties (Maven stores them as
        # separate key=value lines; one-line greps will false-negative)
        # and compare against the same denylist enforced by maven-dep-check.
        # This step is a no-op while the strict-no-jars rule above holds,
        # but the parser is verified inline so future expansions stay safe.
        run: |
          set -e

          # Build the denylist (groupId:artifactId, max-allowed-version-prefix-pattern)
          # Aligned with maven-dep-check (see README of this workflow).
          declare -A DENY=(
            ["ch.qos.logback:logback-classic"]='^1\.5\.(1[0-8]|[0-9])$|^1\.[0-4]\.'
            ["ch.qos.logback:logback-core"]='^1\.5\.(1[0-8]|[0-9])$|^1\.[0-4]\.'
            ["io.netty:netty-common"]='^4\.1\.([0-9]|[1-9][0-9]|1[0-2][0-9]|13[0-5])\.Final$'
            ["org.apache.cxf:cxf-core"]='^[123]\.'
            ["com.fasterxml.jackson.core:jackson-databind"]='^2\.([0-9]|1[0-9]|20)\.'
            ["commons-io:commons-io"]='^2\.(1[0-9])\.'
            ["org.apache.httpcomponents:httpclient"]='^4\.5\.1[0-3]$'
            ["junit:junit"]='^4\.1[0-2]$'
          )

          # Inline self-test: synthesize a pom.properties stream and confirm
          # the parser extracts artifactId/version from separate lines (this
          # is what the previous regex-on-strings approach got wrong).
          cat > /tmp/pomprops.test <<'EOF'
          #Generated by Maven
          version=1.4.14
          groupId=ch.qos.logback
          artifactId=logback-classic
          EOF
          parsed_g=$(awk -F= '/^groupId=/  {print $2}' /tmp/pomprops.test)
          parsed_a=$(awk -F= '/^artifactId=/{print $2}' /tmp/pomprops.test)
          parsed_v=$(awk -F= '/^version=/  {print $2}' /tmp/pomprops.test)
          if [ "$parsed_g:$parsed_a" != "ch.qos.logback:logback-classic" ] || [ "$parsed_v" != "1.4.14" ]; then
            echo "::error title=Parser self-test failed::pom.properties parser extracted unexpected values: g='$parsed_g' a='$parsed_a' v='$parsed_v'"
            exit 1
          fi
          if ! echo "$parsed_v" | grep -qE "${DENY[ch.qos.logback:logback-classic]}"; then
            echo "::error title=Denylist self-test failed::1.4.14 should have matched the logback-classic deny pattern"
            exit 1
          fi
          echo "✅ pom.properties parser + denylist self-test passed."

          # Real scan: walk every jar under docker/ and extract pom.properties.
          # (Currently a no-op because the strict-no-jars rule above already
          # blocked everything under docker/solr; if the rule's scope is ever
          # narrowed, this catches the rest.)
          fail=0
          while IFS= read -r jar; do
            # List bundled pom.properties paths inside the jar
            for pomprop in $(unzip -Z1 "$jar" 2>/dev/null | grep -E '^META-INF/maven/.+/pom\.properties$' || true); do
              tmp=$(mktemp)
              unzip -p "$jar" "$pomprop" > "$tmp" 2>/dev/null || { rm -f "$tmp"; continue; }
              g=$(awk -F= '/^groupId=/  {print $2; exit}' "$tmp")
              a=$(awk -F= '/^artifactId=/{print $2; exit}' "$tmp")
              v=$(awk -F= '/^version=/  {print $2; exit}' "$tmp")
              rm -f "$tmp"
              key="$g:$a"
              pat="${DENY[$key]:-}"
              if [ -n "$pat" ] && echo "$v" | grep -qE "$pat"; then
                echo "::error title=Stale shaded dep::$jar bundles $key:$v (matches deny pattern)"
                fail=1
              fi
            done
          done < <(find docker/ -type f -name '*.jar' 2>/dev/null)

          if [ $fail -ne 0 ]; then
            exit 1
          fi
          echo "✅ pom.properties drift scan passed (parser ready; no jars currently in scope)."

  xml-hardening:
    name: XML parser hardening gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Enforce the "construct XML parsers only via SecureXml" invariant so the
    # XXE hardening cannot drift or be dropped by a copy-pasted new sink.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Forbid raw XML parser construction outside SecureXml
        run: |
          set -e
          pattern='DocumentBuilderFactory\.newInstance|new[[:space:]]+SAXReader\(|XMLInputFactory\.newInstance|SAXParserFactory\.newInstance'
          hits=$(grep -rnE "$pattern" core/src/main/java common/src/main/java 2>/dev/null \
                 | grep -v 'util/xml/SecureXml\.java' || true)
          if [ -n "$hits" ]; then
            echo "::error title=Unhardened XML parser::Construct XML parsers via jp.aegif.nemaki.util.xml.SecureXml (XXE hardening), not raw factory/reader constructors:"
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "OK: all XML parser construction routes through SecureXml."

  exception-expiry:
    name: Security exception expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Hard gate: fails if any documented risk-acceptance (osv-scanner.toml
    # ignoreUntil / .trivyignore.yaml expiredAt) is past its date, forcing
    # periodic re-review of accepted-but-unfixed advisories. Runs on the daily
    # schedule so an exception "expires into" a red check over time.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Fail on any expired risk-acceptance
        run: |
          python3 - <<'PY'
          import re, datetime, pathlib, sys
          today = datetime.date.today()
          fails = []
          checks = [
              ("osv-scanner.toml",   r'ignoreUntil\s*=\s*(\d{4}-\d{2}-\d{2})'),
              (".trivyignore.yaml",  r'expiredAt\s*:\s*(\d{4}-\d{2}-\d{2})'),
          ]
          for fname, pat in checks:
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              for m in re.finditer(pat, p.read_text()):
                  d = datetime.date.fromisoformat(m.group(1))
                  if d < today:
                      fails.append(f"{fname}: exception dated {d} has expired")
          if fails:
              print("::error title=Expired security exception::" + "; ".join(fails))
              sys.exit(1)
          print("No expired security exceptions.")
          PY

  osv-scan:
    name: OSV dependency scan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational for now: a full recursive OSV pass can surface unfixable or
    # test-only transitive CVEs that need triage rather than an automatic block.
    # FLIP CONDITION (to remove continue-on-error and make this a hard gate):
    # once a run is clean except for advisories that each have a dated entry in
    # osv-scanner.toml, set continue-on-error: false so new, un-accepted CVEs
    # fail the build. The exception-expiry job already hard-fails expired ones.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install osv-scanner (pinned + checksum-verified)
        run: |
          set -euo pipefail
          ver="v1.9.2"
          base="https://github.com/google/osv-scanner/releases/download/${ver}"
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -sSfL -o "$RUNNER_TEMP/osv_sums" "${base}/osv-scanner_SHA256SUMS"
          want=$(grep 'osv-scanner_linux_amd64$' "$RUNNER_TEMP/osv_sums" | awk '{print $1}')
          got=$(sha256sum "$RUNNER_TEMP/osv-scanner" | awk '{print $1}')
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "osv-scanner checksum mismatch: got=$got want=$want"; exit 1; }
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan every pom.xml + package-lock.json against OSV.dev
        # --config points OSV at the documented, time-boxed ignore list so
        # accepted no-fix advisories (e.g. the Solr GHSA) do not re-flag until
        # their ignoreUntil date, at which point exception-expiry fails.
        run: |
          "$RUNNER_TEMP/osv-scanner" --config=osv-scanner.toml --recursive --skip-git --format table . | tee osv-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: osv-report
          path: osv-report.txt
          retention-days: 30

  trivy-image:
    name: Trivy scan — Solr runtime image (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # INFORMATIONAL, not a hard gate. The Solr image is a third-party
    # distribution (solr:*-slim) plus our config; its HIGH/CRITICAL findings are
    # overwhelmingly in bundled libraries (Jetty, ZooKeeper, Netty, Jackson, …)
    # that we CANNOT patch independently of a new upstream Solr image — so
    # blocking on them would be non-actionable churn that re-reddens every time
    # the vuln DB updates. The actionable signal — "a newer Solr base image
    # exists" — is delivered by Dependabot (docker ecosystem, watching
    # docker/solr/Dockerfile's FROM). Our OWN Java dependencies are hard-gated
    # by maven-dep-check + OSV. This job publishes the full report (table +
    # SARIF artifact) for visibility. The core image is likewise scanned
    # informationally in release-images.yml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Trivy (pinned; install.sh verifies the release checksum)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP" v0.72.0
      - name: Build the Solr runtime image
        run: docker build -t nemakiware-solr:ci docker/solr
      - name: Trivy image scan — HIGH/CRITICAL report (table)
        run: |
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --format table \
            nemakiware-solr:ci
      - name: Trivy image scan — SARIF artifact
        if: always()
        run: |
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-solr.sarif \
            nemakiware-solr:ci || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-solr-sarif
          path: trivy-solr.sarif
          retention-days: 30
