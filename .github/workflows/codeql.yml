name: CodeQL

# Static application security testing (SAST) for the Java + TypeScript code.
#
# Rollout per the security roadmap: this runs on master pushes + weekly
# schedule to establish a baseline in the Security tab. It is intentionally
# NOT wired to pull_request yet — promote it to a required PR check only after
# the initial findings baseline is triaged and stable (avoids blocking work on
# day one). Uses build-mode "none" (buildless extraction) for both languages,
# so no Maven build / GitHub Packages auth / npm install is needed here.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, main, 'release/**' ]
  schedule:
    - cron: '30 2 * * 1'   # weekly, Monday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload SARIF results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:${{ matrix.language }}"
