name: CodeQL

# Static application security testing (SAST) for the Java + TypeScript code.
#
# Rollout per the security roadmap: this runs on master pushes + weekly
# schedule to establish a baseline in the Security tab. It is intentionally
# NOT wired to pull_request yet — promote it to a required PR check only after
# the initial findings baseline is triaged and stable (avoids blocking work on
# day one). Uses build-mode "none" (buildless extraction) for both languages,
# so no Maven build / GitHub Packages auth / npm install is needed here.

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '30 2 * * 1'   # weekly, Monday 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload SARIF results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          category: "/language:${{ matrix.language }}"
