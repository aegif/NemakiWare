###Retention & Long-term Storage
# Enable automatic retention lifecycle (ACTIVE -> ARCHIVED_LOCAL -> ARCHIVED_COLD)
retention.enabled=false
# Days after last modification before auto-archiving documents without cmis:rm_expirationDate
# Set to empty to disable inactivity-based archiving (expiration-based archiving still works)
retention.archive.local.after.days=365
# Days after archiving before moving to cold storage
retention.archive.cold.after.days=90
# Cron schedule for auto-archive job (Spring cron: sec min hour day month weekday)
retention.schedule.archive.local=0 0 3 * * *
# Cron schedule for cold-move job
retention.schedule.archive.cold=0 30 3 * * *
# Keep local copy in archive store after cold storage write (true=copy mode, false=move mode)
retention.cold.keep.local.copy=true

# Long-term storage type: "s3", "filesystem", or "inmemory" (testing only)
longterm.storage.type=filesystem
# [BETA] S3-compatible storage settings (requires AWS subscription)
longterm.s3.bucket=
longterm.s3.region=
longterm.s3.endpoint=
longterm.s3.accessKey=
longterm.s3.secretKey=
# Enable S3 Legal Hold on cold-archived objects (true = apply Legal Hold after upload)
longterm.s3.legalHold=false
# Filesystem storage base path
longterm.fs.path=/var/nemakiware/cold-archive

