###Public-facing scheme — controls Cookie Secure flag and X-Forwarded-Proto trust.
# auto  : trust request.isSecure() (Tomcat RemoteIpValve handles trusted proxies)
# https : operator declares the public URL is HTTPS — cookies always Secure-flagged,
#         misconfigured proxies are surfaced as warnings instead of silently downgrading
# http  : explicit dev-only deployment, never sets Secure
nemakiware.public.scheme=auto

