###External Ingestion — folder-scoped delegation (3.1.1-RC3+)
# Maximum number of folder hops walked when checking whether a target
# folder is in a delegated connector's allowedFolderIds scope. Walks
# start from the target folder and follow parent IDs upward; the cap
# acts as a circuit breaker against pathological cycles and unbounded
# depth. Default 128 leaves wide headroom for typical hierarchies
# (<20 levels). Increase if a legitimate deep tree falls through.
# Invalid / non-positive values fall back to the default with a WARN.
#nemakiware.ingest.ancestorWalk.maxHops=128

###External Ingestion — scheduled delegated profiles (3.1.1-RC5+ / v2)
# Allow non-admin delegated profiles to run on the scheduler. Default
# false (safe — delegated profiles are manual-only, preserving the RC3
# behaviour). Set to true to opt in to the v2 scheduled-delegated
# behaviour: the scheduler synthesises a CallContext from the profile's
# createdByUserId, re-evaluates cmis:all + connector delegation on every
# tick, and refuses with a structured DenialReason if any check fails.
# Operators should understand the creator-deactivation policy below
# before enabling this in production.
#nemakiware.ingest.delegated.schedulerEnabled=false

# When a delegated profile's createdByUserId no longer points to an
# active UserItem (deleted, disabled, deactivated by LDAP sync), the
# scheduler always emits an audit entry with denialReason
# CREATOR_USER_INACTIVE and skips that tick. With this property set to
# true the scheduler ALSO disables the profile (sets enabled=false)
# after a sustained run of failures so the tick stops repeating. Default
# false (fail-shut + visible audit only — operator manually decides
# whether to keep the profile around for re-ownership or delete it).
#nemakiware.ingest.delegated.autoDisableInactiveOwners=false

# Number of consecutive CREATOR_USER_INACTIVE failures before
# autoDisableInactiveOwners kicks in. Has no effect when
# autoDisableInactiveOwners=false. Default 3 (≈15 minutes at the
# default 5-min poll interval).
#nemakiware.ingest.delegated.inactiveOwnerFailureThreshold=3

### Outbound SSRF hardening (security audit)
# Opt-in SSRF check for admin-configured outbound catalog endpoints
# (Purview / Atlas). Default false so existing internal / on-prem
# endpoints keep working. Set to true on internet-facing deployments.
nemakiware.security.outbound.validateInternal=false
