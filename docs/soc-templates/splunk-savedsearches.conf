# Splunk savedsearches.conf entries for NemakiWare audit alerts.
# Drop into $SPLUNK_HOME/etc/apps/<your-app>/local/savedsearches.conf
# (or import via UI: Settings → Searches, reports, and alerts).
# Pairs with fluent-bit-nemakiware.conf or vector-nemakiware.toml
# (Splunk HEC sink).
#
# Pre-deploy checklist:
#   1. Replace every ${PLACEHOLDER}.
#   2. `splunk btool savedsearches list --debug | grep NemakiWare`.
#   3. Verify in UI: Settings → Searches → filter "NemakiWare".

# ── 1. simulate burst ──
[NemakiWare - governance simulate burst]
search = index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
         operation="externalGovernanceSimulate" \
         | bucket _time span=5m \
         | stats count BY _time userId \
         | where count > ${BURST_THRESHOLD:-20}
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_scheduled = 1
alert.severity = 3
# Notification wiring (PagerDuty / Slack / email) — fill in via UI's
# "Add Actions" flow; not committed here for secrets-management reasons.
description = > BURST_THRESHOLD externalGovernanceSimulate events \
              by one actor in 5 min. Playbook: \
              docs/SOC-AUDIT-INTEGRATION.md §5.1

# ── 2. lost-count outlier ──
# Field names containing dots are quirky in SPL: `"details.lostCount" > 50`
# is not a stable numeric comparison because Splunk's auto-extracted
# value may be indexed as a string. The portable shape is:
#  - rename the dotted field to a flat one
#  - coerce via tonumber()
#  - compare in `where`
# This is what `where tonumber('details.lostCount') > N` does, but the
# rename keeps the table output and downstream alert action payload clean.
[NemakiWare - lost-count outlier]
search = index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
         operation="externalGovernanceSimulate" \
         | rename "details.lostCount" AS lost_count, \
                  "details.principalId" AS principal_id, \
                  "details.removePrincipalIds" AS remove_principal_ids \
         | where tonumber(lost_count) > ${LOST_COUNT_OUTLIER_THRESHOLD:-50} \
         | table _time userId principal_id lost_count remove_principal_ids
cron_schedule = */1 * * * *
dispatch.earliest_time = -2m
dispatch.latest_time = now
is_scheduled = 1
alert.severity = 3
description = Simulate event with lostCount > threshold. \
              Sweeping change pre-flight — review before subsequent \
              externalProfileUpdated / connector PUT. \
              Playbook: docs/SOC-AUDIT-INTEGRATION.md §5.2

# ── 3. asked-then-acted ──
# transaction's startswith/endswith accept eval expressions, NOT
# `field=value` literals. The earlier draft used `startswith="operation=…"`
# which Splunk parses as a search-string match — semantically fragile and
# version-dependent. The portable shape uses eval-form predicates so the
# parser is unambiguous. We also drop the inner `where eventcount > 1`
# because a properly-bounded transaction with both startswith AND endswith
# can only complete when at least one of each is present.
[NemakiWare - asked-then-acted correlation]
search = index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
         (operation="externalGovernanceSimulate" OR \
          operation="externalProfileUpdated" OR \
          operation="externalProfileDeleted") \
         | transaction userId \
             maxspan=30m \
             startswith=eval(operation=="externalGovernanceSimulate") \
             endswith=eval(operation=="externalProfileUpdated" OR operation=="externalProfileDeleted") \
         | table _time userId duration eventcount operation objectId
cron_schedule = */5 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
is_scheduled = 1
alert.severity = 2
description = Simulate followed by act within 30 min. Cross-reference \
              against change-management ticketing. \
              Playbook: docs/SOC-AUDIT-INTEGRATION.md §5.3

# ── 4. off-hours simulate ──
# Splunk's `date_hour` field is the integer hour-of-day. Adjust
# the comparison for your business hours window in local time
# (Splunk indexes UTC; if your shifts differ from UTC, prefix
# with `convert ctime(_time) AS local_time` and parse from local_time).
[NemakiWare - off-hours simulate]
search = index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
         operation="externalGovernanceSimulate" \
         | eval hour = strftime(_time, "%H") \
         | where hour < "${BUSINESS_HOURS_START_LOCAL:-06}" \
              OR hour >= "${BUSINESS_HOURS_END_LOCAL:-22}" \
              OR date_wday="saturday" OR date_wday="sunday" \
         | table _time userId details.principalId details.lostCount
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
is_scheduled = 1
alert.severity = 3
description = Off-hours simulate event. Paired with §5.3 = High. \
              Playbook: docs/SOC-AUDIT-INTEGRATION.md §5.4

# ── 5. new-actor first-time invoker ──
[NemakiWare - new-actor first-time invoker]
search = index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
         operation="externalGovernanceSimulate" \
         earliest=-1h latest=now \
         | stats earliest(_time) AS first_seen BY userId \
         | join type=left userId \
             [ search index=${SIEM_SPLUNK_INDEX:-nemakiware} sourcetype=nemakiware_audit \
                operation="externalGovernanceSimulate" \
                earliest=-${NEW_ACTOR_LOOKBACK:-90d} latest=-1h \
              | stats count BY userId \
              | rename count AS historical_count ] \
         | where isnull(historical_count) \
         | table userId first_seen
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
is_scheduled = 1
alert.severity = 2
description = Actor invoked governance simulate for the first time \
              in ${NEW_ACTOR_LOOKBACK:-90d}. Expected for rotation / \
              new hire; one human-look confirmation. \
              Playbook: docs/SOC-AUDIT-INTEGRATION.md §5.5
