# Fluent Bit input for NemakiWare audit log.
# Examples below for Loki, Splunk HEC, and Elasticsearch — pick ONE
# [OUTPUT] block and delete the others.
# Pairs with loki-ruler-rules.yml (Loki) / splunk-savedsearches.conf
# (Splunk) / kibana-detection-rules.ndjson (Elasticsearch).
#
# Pre-deploy checklist:
#   1. Replace every ${PLACEHOLDER} value.
#   2. `fluent-bit -c fluent-bit-nemakiware.conf --dry-run` (3.0+).
#   3. Start with `--verbose` once; tail Fluent Bit's own log for
#      "successfully sent" lines within 60 s.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               nemakiware.audit
    Path              ${NEMAKIWARE_AUDIT_LOG_PATH}
    # Each audit line is already JSON
    Parser            json
    # Don't tail rolled+gzipped files
    Exclude_Path      ${NEMAKIWARE_AUDIT_LOG_PATH}.*.gz
    # Position file so a Fluent Bit restart doesn't re-send already-shipped lines
    DB                /var/lib/fluent-bit/nemakiware-audit-position.db
    DB.Sync           Normal
    Refresh_Interval  5
    Skip_Long_Lines   Off
    # Audit lines are <= ~4 KB after RC6.1 P2-1 cap; raise to 128 KB
    # only if you carry oversized custom details fields.
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   128k

# Tag every event with a `service` field for downstream label filtering.
[FILTER]
    Name              record_modifier
    Match             nemakiware.audit
    Record            service nemakiware
    Record            source_type audit
    Record            nemakiware_host ${HOSTNAME}

# Time-of-day enrichment for the off-hours alert rule. Adds
# `hour_of_day_local` (integer 0-23) and `day_of_week_local`
# (Monday..Sunday string) fields. Without these, the
# kibana-detection-rules.ndjson off-hours rule never fires.
# Adjust ${BUSINESS_HOURS_TZ} to your operator's IANA TZ
# (default UTC). For non-UTC, ensure Fluent Bit's TZ env is set
# (e.g. `TZ=Asia/Tokyo` in the systemd unit).
[FILTER]
    Name              lua
    Match             nemakiware.audit
    Call              add_time_enrichment
    Code              |
                      function add_time_enrichment(tag, ts, record)
                        local audit_ts = record["timestamp"] or record["@timestamp"]
                        if audit_ts == nil then return 0, ts, record end
                        -- audit_ts is ISO-8601 like 2026-05-22T08:01:30Z (UTC).
                        local y, mo, d, h, mi, s = string.match(audit_ts,
                          "(%d+)-(%d+)-(%d+)T(%d+):(%d+):(%d+)")
                        if y == nil then return 0, ts, record end
                        -- Lua's os.time(t) interprets the table as LOCAL
                        -- time, not UTC. We want the UTC epoch of the
                        -- audit moment. Approach:
                        --   1. naive = os.time(UTC components treated as local)
                        --   2. The TZ offset AT THAT MOMENT may differ from
                        --      now (DST). Compute it per-record by checking
                        --      what naive's local breakdown vs UTC breakdown
                        --      says, then ADD to get the true UTC epoch.
                        --   3. Re-validate after the shift (a DST-boundary
                        --      audit may need a one-step correction).
                        --
                        -- For non-UTC ops, set TZ env on the Fluent Bit
                        -- process (e.g. systemd `Environment=TZ=Asia/Tokyo`)
                        -- — Lua's os.date(format, epoch) honours TZ env.
                        --
                        -- For TZs WITHOUT DST (UTC, JST, KST, AEST, ...) the
                        -- "now-based" shortcut would suffice; the per-record
                        -- compute below is safe for either.
                        local function utc_offset_at(epoch)
                          return os.difftime(epoch, os.time(os.date("!*t", epoch)))
                        end
                        local naive = os.time({
                          year=tonumber(y), month=tonumber(mo), day=tonumber(d),
                          hour=tonumber(h), min=tonumber(mi), sec=tonumber(s)})
                        local offset = utc_offset_at(naive)
                        local true_utc_epoch = naive + offset
                        -- Re-check: a DST-spring-forward audit timestamp may
                        -- need one iteration to settle. If the offset at the
                        -- new epoch differs, snap to that.
                        local offset2 = utc_offset_at(true_utc_epoch)
                        if offset2 ~= offset then
                          true_utc_epoch = naive + offset2
                        end
                        local local_h = tonumber(os.date("%H", true_utc_epoch))
                        local local_dow = os.date("%A", true_utc_epoch)
                        record["hour_of_day_local"] = local_h
                        record["day_of_week_local"] = local_dow
                        return 1, ts, record
                      end

# Loki — drop / uncomment for Loki ruler integration
[OUTPUT]
    Name              loki
    Match             nemakiware.audit
    Host              ${SIEM_HOST}
    Port              ${SIEM_PORT}
    Tls               on
    Tls.verify        on
    # Stream labels Loki indexes on. Keep small — high-cardinality
    # principal IDs go in the log body, NOT in labels.
    Labels            service=nemakiware,source_type=audit,host=$nemakiware_host
    # Pull these audit fields out as additional labels for fast filter.
    # operation lets alert rules group by op; result lets ops dashboards
    # split SUCCESS vs FAILURE.
    Label_Keys        $operation,$result,$repositoryId
    Line_Format       json
    Auto_Kubernetes_Labels off
    # Auth header — use either Basic or BearerToken, not both
    Http_User         ${SIEM_USERNAME}
    Http_Passwd       ${SIEM_PASSWORD}
    # BearerToken     ${SIEM_API_KEY}

