# Vector pipeline for NemakiWare audit log.
# Three example sinks below — pick ONE and delete the others.
# Pairs with the matching alert rules in this directory.
#
# Pre-deploy checklist:
#   1. Replace every dollar-brace placeholder marker used elsewhere
#      in this file. (Vector interpolates dollar-brace tokens even
#      inside comments — RC6.4 caught this when a literal example in
#      this header tripped "Missing environment variable" at
#      validate-time.)
#   2. `vector validate vector-nemakiware.toml`.
#   3. Restart Vector with `--watch-config` for iterative tuning.

# Tail audit.log; Vector handles file rotation automatically.
[sources.nemakiware_audit]
  type = "file"
  include = ["${NEMAKIWARE_AUDIT_LOG_PATH}"]
  # Don't tail rolled .gz historical files
  exclude = ["**/audit.log.*.gz"]
  read_from = "end"
  # Local persistence — Vector survives restarts without re-shipping.
  data_dir = "/var/lib/vector/nemakiware-audit"
  # Audit lines are <= ~4 KB after RC6.1 P2-1 cap; raise for custom details.
  max_line_bytes = 65536

# Parse the JSON, add a service tag, drop ECS host fields that
# duplicate the audit event's own `hostname`. Also enrich with
# operator-local hour_of_day_local (0-23) and day_of_week_local
# (Monday..Sunday) so the kibana-detection-rules.ndjson off-hours
# rule fires — without this enrichment, the rule never matches.
# Adjust ${BUSINESS_HOURS_TZ} to your operator's IANA TZ (default
# UTC; set e.g. Asia/Tokyo for JST).
[transforms.parse]
  type = "remap"
  inputs = ["nemakiware_audit"]
  source = '''
    . = parse_json!(.message)
    .service = "nemakiware"
    .source_type = "audit"
    .nemakiware_host = get_hostname!()
    # Time-of-day enrichment for off-hours alerts. VRL field paths
    # with special characters need quoted-path syntax — `."@timestamp"`
    # not `.@timestamp`. We try the ECS @timestamp first then fall
    # back to the legacy `timestamp` field (NemakiWare emits both
    # on every audit event but the legacy field is more reliable
    # in older configs).
    #
    # Field access in VRL is infallible — it returns `null` for a
    # missing path, never errors. RC6.4 caught a `vector validate`
    # failure ("unnecessary error coalescing operation") from the
    # previous `."@timestamp" ?? .timestamp` form. The right way to
    # do null-fallback is conditional assignment, not `??` (which is
    # only for fallible expressions like parse_*).
    #
    # parse_timestamp IS fallible — VRL strict mode requires explicit
    # error handling. The `?? null` coalesce produces a null result
    # if ts_str is non-string or doesn't match the format, which the
    # if-guard below then skips. The format_timestamp! / to_int! calls
    # inside the guard are infallible-on-valid-input since ts_parsed
    # != null implies a real Timestamp by this point.
    ts_str = ."@timestamp"
    if ts_str == null { ts_str = .timestamp }
    if ts_str != null {
      ts_parsed = parse_timestamp(ts_str, "%+") ?? null
      if ts_parsed != null {
        .hour_of_day_local = to_int!(format_timestamp!(ts_parsed, "%H", timezone: "${BUSINESS_HOURS_TZ:-UTC}"))
        .day_of_week_local = format_timestamp!(ts_parsed, "%A", timezone: "${BUSINESS_HOURS_TZ:-UTC}")
      }
    }
  '''

# ─── Loki sink ────────────────────────────────────────────
[sinks.loki]
  type = "loki"
  inputs = ["parse"]
  endpoint = "${SIEM_ENDPOINT}"
  encoding.codec = "json"
  # Keep label cardinality low — high-cardinality fields (principalId,
  # eventId) stay in the JSON log body, NOT in labels.
  labels.service = "nemakiware"
  labels.source_type = "audit"
  labels.operation = "{{ operation }}"
  labels.result = "{{ result }}"
  labels.repositoryId = "{{ repositoryId }}"
  auth.strategy = "basic"
  auth.user = "${SIEM_USERNAME}"
  auth.password = "${SIEM_PASSWORD}"
  # Audit must never be dropped on transient outage. Vector enforces
  # `buffer.max_size >= 268435488` (256 MiB + 32 B internal overhead);
  # RC6.4 caught a `vector validate` failure when this was set exactly
  # at 268435456 = 256 MiB. Bump to a comfortable round value so the
  # operator headroom isn't sensitive to Vector minor-version drift.
  buffer.type = "disk"
  buffer.max_size = 536870912  # 512 MiB local buffer
  buffer.when_full = "block"

